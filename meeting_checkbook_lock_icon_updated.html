<script>
const KEY='welfare_checkbook_from_attendance_v1';
const LOCK_KEY='welfare_checkbook_security_v1';
const PBKDF2_ITERATIONS=150000;
let security={enabled:false,autoLockMinutes:0,salt:null,iterations:PBKDF2_ITERATIONS};
let cryptoKey=null,appUnlocked=false,saveChain=Promise.resolve(),lockTimer=null,lastActivity=Date.now();
function defaultState(){return {
 people:[
  {id:'1',name:'김창억',birth:'1949-05-01',phone:'',address:''},{id:'2',name:'박수직',birth:'1951-04-11',phone:'',address:''},
  {id:'3',name:'조강하',birth:'1956-05-01',phone:'',address:''},{id:'4',name:'구조대',birth:'1948-07-05',phone:'',address:''},
  {id:'5',name:'구조대',birth:'1950-05-08',phone:'',address:''},{id:'6',name:'한사방',birth:'1952-02-17',phone:'',address:''},
  {id:'7',name:'고용대',birth:'1955-10-03',phone:'',address:''},{id:'8',name:'최수몽',birth:'1958-12-22',phone:'',address:''}
 ],records:[],trash:[],title:'출석체크',topicType:'출석체크',date:new Date().toISOString().slice(0,10)
}}
let state=defaultState();
if(!Array.isArray(state.trash)) state.trash=[];
let tab='home',query='',deleteMode=false,deleteSelected=new Set(),activeRecordId=null,memoPersonId=null,specialPersonId=null;

function getSecurityMeta(){try{return JSON.parse(localStorage.getItem(LOCK_KEY)||'null')}catch(e){return null}}
function setSecurityMeta(){localStorage.setItem(LOCK_KEY,JSON.stringify({v:2,setupComplete:true,enabled:!!security.enabled,autoLockMinutes:Number(security.autoLockMinutes)||0,salt:security.salt,iterations:security.iterations||PBKDF2_ITERATIONS}))}
function randomBytes(n){const a=new Uint8Array(n);crypto.getRandomValues(a);return a}
function bytesToB64(bytes){let s='';bytes.forEach(b=>s+=String.fromCharCode(b));return btoa(s)}
function b64ToBytes(s){const bin=atob(s);const a=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)a[i]=bin.charCodeAt(i);return a}
async function deriveKey(password,saltB64,iterations=PBKDF2_ITERATIONS){
 const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
 return crypto.subtle.deriveKey({name:'PBKDF2',salt:b64ToBytes(saltB64),iterations,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
async function encryptStateWithKey(key,obj){
 const iv=randomBytes(12),plain=new TextEncoder().encode(JSON.stringify(obj));
 const data=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,plain);
 return JSON.stringify({v:1,alg:'AES-GCM',iv:bytesToB64(iv),data:bytesToB64(new Uint8Array(data))});
}
async function decryptStateWithKey(key,stored){
 const obj=JSON.parse(stored),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64ToBytes(obj.iv)},key,b64ToBytes(obj.data));
 return JSON.parse(new TextDecoder().decode(plain));
}
function save(){
 if(security.enabled && cryptoKey){
  const snapshot=JSON.parse(JSON.stringify(state));
  const key=cryptoKey;
  saveChain=saveChain.then(async()=>{if(key)localStorage.setItem(KEY,await encryptStateWithKey(key,snapshot))}).catch(()=>{});
 }else{
  localStorage.setItem(KEY,JSON.stringify(state));
 }
}
function touchActivity(){if(!appUnlocked)return;lastActivity=Date.now();if(security.enabled&&security.autoLockMinutes>0)scheduleAutoLock()}
function scheduleAutoLock(){clearTimeout(lockTimer);if(!security.enabled||!security.autoLockMinutes||!appUnlocked)return;lockTimer=setTimeout(()=>{if(Date.now()-lastActivity>=security.autoLockMinutes*60000)lockApp();else scheduleAutoLock()},security.autoLockMinutes*60000)}

function showLock(title,html){document.getElementById('lockContent').innerHTML='<h2 style="margin-top:0">'+title+'</h2>'+html;document.getElementById('lockOverlay').style.display='flex'}
function hideLock(){document.getElementById('lockOverlay').style.display='none'}

async function completePasswordSetup(){
 const p=document.getElementById('setupPw').value,p2=document.getElementById('setupPw2').value,msg=document.getElementById('setupMsg');
 if(!/^\d{4}$/.test(p)){msg.textContent='비밀번호는 숫자 4자리로 입력하세요.';msg.style.display='block';return}
 if(p!==p2){msg.textContent='비밀번호가 일치하지 않습니다.';msg.style.display='block';return}
 security={enabled:true,autoLockMinutes:0,salt:bytesToB64(randomBytes(16)),iterations:PBKDF2_ITERATIONS,setupComplete:true};
 localStorage.removeItem(GEOCODE_CACHE_KEY);
 cryptoKey=await deriveKey(p,security.salt,security.iterations);setSecurityMeta();save();appUnlocked=true;hideLock();installActivityWatch();const dp=document.getElementById('datePicker');if(dp)dp.value=state.date;render();toast('🔒 앱 잠금이 설정되었습니다.');
}
function chooseNoPassword(){
 security={enabled:false,autoLockMinutes:0,salt:null,iterations:PBKDF2_ITERATIONS,setupComplete:true};cryptoKey=null;setSecurityMeta();
 try{const raw=localStorage.getItem(KEY);if(raw){const parsed=JSON.parse(raw);if(parsed&&parsed.data&&parsed.iv){alert('암호화된 기록은 현재 비밀번호가 필요합니다.');return}}}catch(e){}
 appUnlocked=true;hideLock();installActivityWatch();const dp=document.getElementById('datePicker');if(dp)dp.value=state.date;render();
}
async function unlockWithPassword(){
 const input=document.getElementById('unlockPw'),msg=document.getElementById('unlockMsg'),p=input.value;if(!p){msg.textContent='비밀번호를 입력하세요.';msg.style.display='block';return}
 try{
  cryptoKey=await deriveKey(p,security.salt,security.iterations||PBKDF2_ITERATIONS);

async function bootSecurity(){

  if(raw){try{state=JSON.parse(raw)}catch(e){state=defaultState()}}
  setupSecurity();return;
 }
 security=meta;security.enabled=false;cryptoKey=null;
 if(raw){try{state=JSON.parse(raw)}catch(e){state=defaultState()}}

async function disablePassword(){
 if(!security.enabled||!cryptoKey)return;
 if(!confirm('비밀번호 사용을 해제할까요?\n이후에는 기기의 브라우저 저장공간에 암호화되지 않은 형태로 저장됩니다.'))return;
 const current=prompt('현재 비밀번호를 입력하세요.');if(current===null)return;
 try{const k=await deriveKey(current,security.salt,security.iterations||PBKDF2_ITERATIONS);state=await decryptStateWithKey(k,localStorage.getItem(KEY))}catch(e){alert('현재 비밀번호가 맞지 않습니다.');return}
 security={enabled:false,autoLockMinutes:0,salt:null,iterations:PBKDF2_ITERATIONS,setupComplete:true};cryptoKey=null;setSecurityMeta();save();toast('비밀번호 사용을 해제했습니다.');render();
}
function setAutoLock(v){security.autoLockMinutes=Number(v)||0;setSecurityMeta();if(security.autoLockMinutes)scheduleAutoLock();else clearTimeout(lockTimer);toast('자동 잠금 설정이 저장되었습니다.')}

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nameNorm(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
function phoneNorm(s){return String(s||'').replace(/[^\d+]/g,'')}
function birthNorm(v){
 if(v===null||v===undefined||v==='')return '';
 if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
 let s=String(v).trim().replace(/\s/g,'');
 let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
 if(/^\d{6}$/.test(s)){let yy=+s.slice(0,2);return (yy<=25?2000+yy:1900+yy)+'-'+s.slice(2,4)+'-'+s.slice(4,6)}
 let n=Number(s);if(isFinite(n)&&n>20000&&n<70000){let d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
 return s
}
function birth6(b){let m=String(b||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[1].slice(2)+m[2]+m[3]:b||''}
function getRecord(create=true){
 let r=activeRecordId ? state.records.find(x=>x.id===activeRecordId) : state.records.find(x=>x.date===state.date&&x.title===state.title);
 if(!r&&create){
  r={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:state.people.map(p=>({...p}))};
  state.records.push(r);activeRecordId=r.id;
 }
 if(r){
  state.date=r.date||state.date;
  state.title=r.title||state.title||'기타';
  state.topicType=r.topicType||inferTopicType(state.title);
  // 기록에 명단이 있으면 반드시 그 명단을 현재 화면으로 복원한다.
  // 구버전 기록에 명단이 없으면 현재 명단을 기록에 스냅샷으로 저장한다.
  if(Array.isArray(r.people) && r.people.length){
    state.people=r.people.map(p=>({...p}));
  }else if(state.people.length){
    r.people=state.people.map(p=>({...p}));
  }
 }
 return r
}
function checkedSet(){let r=getRecord(false);return new Map(r?Object.keys(r.checks).filter(k=>r.checks[k]).map(k=>[k,r.checks[k]]):[])}
function specialTopic(){return ['방문상담','물품수령','안부확인'].includes(state.topicType)}
function parseCheck(v){
 if(v && typeof v==='object') return {relation:v.relation||'',time:v.time||'',memo:v.memo||'',checked:v.checked!==false};
 if(typeof v==='string' && ['본인','가족','기타'].includes(v)) return {relation:v,time:'',memo:'',checked:true};
 if(v===true) return {relation:'',time:'',memo:'',checked:true};
 return {relation:'',time:'',memo:'',checked:false};
}
function setSpecialCheck(id,relation,hour,minute){
 let r=getRecord();
 const time=(hour&&minute)?hour+':'+minute:'';
 const old=parseCheck(r.checks[id]);
 if(!relation){delete r.checks[id];}
 else{r.checks[id]={relation,time,memo:old.memo||'',checked:true};}
 r.people=state.people.map(p=>({...p}));
 save();render();toast(relation?relation+(time?' · '+time:'')+'로 체크되었습니다.':'체크가 취소되었습니다.');
}

function createNewTopic(){
 const topicType=document.getElementById('newTopicType').value;
 const customTitle=document.getElementById('newTitle').value.trim();
 const title=topicType==='기타'?(customTitle||'기타'):topicType;
 const f=document.getElementById('newFile').files[0];
 if(!title){alert('새로운 주제명을 입력하세요.');return}
 if(!f){
   state.people=[];
   state.title=title;
   state.topicType=topicType;
   state.date=new Date().toISOString().slice(0,10);
   query='';
   deleteMode=false;
   deleteSelected=new Set();
   const nr={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:[]};
   state.records.push(nr);
   activeRecordId=nr.id;

   render();
   toast('새 체크북이 시작되었습니다 · 화면에서 명단을 추가하세요');
   return;
 }
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   let h=rows.findIndex(row=>row.some(v=>['이름','성명','대상자명','대상자'].includes(String(v).trim())));
   if(h<0)h=5;
   const heads=rows[h].map(v=>String(v).trim());
   let ni=heads.findIndex(v=>['이름','성명','대상자명','대상자'].includes(v));if(ni<0)ni=1;
   let bi=heads.findIndex(v=>v.includes('생년'));if(bi<0)bi=2;
   let pi=heads.findIndex(v=>v.includes('전화')||v.includes('휴대'));if(pi<0)pi=3;
   const people=[];
   rows.slice(h+1).forEach(row=>{
    const name=String(row[ni]??'').trim();if(!name)return;
    let ai=heads.findIndex(v=>v.includes('주소')||v.includes('거주지')||v.includes('도로명')); if(ai<0)ai=4;
    people.push({id:crypto.randomUUID(),name,birth:birthNorm(row[bi]),phone:String(row[pi]??'').trim(),address:String(row[ai]??'').trim()});
   });
   if(!people.length){alert('Excel에서 대상자 명단을 찾지 못했습니다.');return}
   state.people=people;
   state.title=title;
   state.topicType=topicType;
   state.date=new Date().toISOString().slice(0,10);
   query='';
   const nr={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:people.map(p=>({...p}))};
   state.records.push(nr);
   activeRecordId=nr.id;
   save();
   closeNew();
   tab='check';
   document.getElementById('datePicker').value=state.date;
   render();
   toast('새 체크북이 시작되었습니다 · '+people.length+'명');
  }catch(err){alert('Excel 읽기 오류: '+err.message)}
 };
 reader.readAsArrayBuffer(f);
}

function deleteSelectedPeople(){

 state.people=state.people.filter(p=>!ids.has(String(p.id)));
 // 현재 편집 중인 기록에서도 삭제한 사람 제거
 const current=activeRecordId
   ? state.records.find(x=>x.id===activeRecordId)
   : state.records.find(x=>x.date===state.date && x.title===state.title);
 if(current){
   current.people=state.people.map(p=>({...p}));
   current.checks=current.checks||{};
   ids.forEach(id=>delete current.checks[id]);
 }
 deleteMode=false;
 deleteSelected=new Set();
 save();
 render();
 toast(`${ids.size}명이 현재 명단에서 삭제되었습니다.`);
}

function voiceInput(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 document.getElementById('voiceModal').style.display='flex';
 const msg=document.getElementById('voiceMsg'),res=document.getElementById('voiceResults');res.innerHTML='';
 if(!SR){msg.textContent='이 브라우저는 음성인식을 지원하지 않습니다. Chrome 또는 Edge에서 사용하세요.';return}
 msg.textContent='🎙️ 듣고 있습니다. 이름을 말씀하세요.';
 const rec=new SR();rec.lang='ko-KR';rec.interimResults=false;rec.continuous=false;rec.maxAlternatives=3;
 rec.onresult=e=>{
   const spoken=e.results[0][0].transcript.trim();query=spoken;document.getElementById('search').value=spoken;
   const exact=state.people.filter(p=>nameNorm(p.name)===nameNorm(spoken));
   const matches=exact.length?exact:state.people.filter(p=>nameNorm(spoken).includes(nameNorm(p.name))||nameNorm(p.name).includes(nameNorm(spoken)));
   msg.textContent='인식: '+spoken;
   if(matches.length===1){toggle(matches[0].id);res.innerHTML=`<div class="ok">✓ ${esc(matches[0].name)} · ${esc(birth6(matches[0].birth))} 체크 완료</div>`;}
   else if(matches.length){res.innerHTML='<div class="warn">동명이인 또는 유사한 이름입니다. 생년월일을 확인하세요.</div>'+matches.map(p=>`<div class="result" onclick="toggle('${String(p.id).replace(/'/g,"\\'")}');closeVoice()"><b>${esc(p.name)}</b><br><span class="muted">${esc(birth6(p.birth))}${p.phone?' · '+esc(p.phone):''}${p.address?' · '+esc(p.address):''}</span></div>`).join('')}
   else res.innerHTML='<div class="warn">일치하는 대상자가 없습니다. 검색 결과를 확인하세요.</div>';
   drawSearch()
 };
 rec.onerror=e=>msg.textContent='음성인식 오류: '+(e.error||'다시 시도해주세요.');rec.start()
}

function importExcel(){
 const f=document.getElementById('excelFile').files[0];if(!f){alert('Excel 파일을 선택하세요.');return}
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   let h=rows.findIndex(row=>row.some(v=>['이름','성명','대상자명','대상자'].includes(String(v).trim())));if(h<0)h=5;
   const heads=rows[h].map(v=>String(v).trim());
   let ni=heads.findIndex(v=>['이름','성명','대상자명','대상자'].includes(v));if(ni<0)ni=1;
   let bi=heads.findIndex(v=>v.includes('생년'));if(bi<0)bi=2;
   let pi=heads.findIndex(v=>v.includes('전화')||v.includes('휴대'));if(pi<0)pi=3;
   let ai=heads.findIndex(v=>v.includes('주소')||v.includes('거주지')||v.includes('도로명'));if(ai<0)ai=4;
   const people=[];rows.slice(h+1).forEach(row=>{const name=String(row[ni]??'').trim();if(!name)return;people.push({id:crypto.randomUUID(),name,birth:birthNorm(row[bi]),phone:String(row[pi]??'').trim(),address:String(row[ai]??'').trim()})});
   if(!people.length){alert('이름 열을 찾지 못했거나 명단이 없습니다.');return}
   state.people=people;
   const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
   if(r) r.people=people.map(p=>({...p}));
   save();query='';deleteMode=false;deleteSelected=new Set();tab='check';render();toast(people.length+'명 명단을 불러왔습니다.')
  }catch(err){alert('Excel 읽기 오류: '+err.message)}
 };reader.readAsArrayBuffer(f)
}

const GEOCODE_CACHE_KEY='meeting_checkbook_geocode_v1';
function loadGeocodeCache(){if(security.enabled)return {};try{return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)||'{}')}catch(e){return {}}}
function saveGeocodeCache(c){if(security.enabled)return;localStorage.setItem(GEOCODE_CACHE_KEY,JSON.stringify(c))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function haversineKm(a,b){
 const R=6371,rad=Math.PI/180;
 const dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;
 const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
async function geocodeAddress(address){
 const cache=loadGeocodeCache();
 const key=String(address||'').trim();
 if(!key)return null;
 if(cache[key] && Number.isFinite(cache[key].lat) && Number.isFinite(cache[key].lon))return cache[key];
 const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q='+encodeURIComponent(key);
 const res=await fetch(url,{headers:{'Accept':'application/json'}});
 if(!res.ok)throw new Error('주소 검색 서버 응답 오류 ('+res.status+')');
 const data=await res.json();
 if(!Array.isArray(data)||!data.length)return null;
 const coord={lat:Number(data[0].lat),lon:Number(data[0].lon),display_name:data[0].display_name||''};
 if(!Number.isFinite(coord.lat)||!Number.isFinite(coord.lon))return null;
 cache[key]=coord;saveGeocodeCache(cache);
 return coord;
}
function openNaverCarRouteById(id){
 const p=state.people.find(x=>String(x.id)===String(id));
 if(!p||!String(p.address||'').trim()){alert('다음 방문자의 주소가 없습니다. 주소를 입력한 뒤 다시 시도하세요.');return}
 const appName=encodeURIComponent('https://meeting-checkbook.vercel.app/');
 (async()=>{
  try{
   const coord=await geocodeAddress(p.address);
   if(!coord){alert(p.name+'님의 주소를 지도 좌표로 찾지 못했습니다.\n주소: '+p.address);return}
   const params='dlat='+encodeURIComponent(coord.lat)+'&dlng='+encodeURIComponent(coord.lon)+'&dname='+encodeURIComponent('방문지')+'&appname='+appName;
   const nmap='nmap://route/car?'+params;
   const intent='intent://route/car?'+params+'#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end';
   const ua=navigator.userAgent;
   if(/Android/i.test(ua)) location.href=intent;
   else if(/iPhone|iPad|iPod/i.test(ua)){
    let appOpened=false;
    const markOpened=()=>{appOpened=true};
    document.addEventListener('visibilitychange',markOpened,{once:true});
    window.addEventListener('pagehide',markOpened,{once:true});
    location.href=nmap;
    // iOS에서 네이버지도 앱 실행에 시간이 걸릴 수 있어 너무 이른 App Store 전환을 방지
    setTimeout(()=>{
      if(!appOpened && document.visibilityState!=='hidden'){
        location.href='https://apps.apple.com/kr/app/id311867728';
      }
    },5000);
   }else window.open('https://map.naver.com/p/search/'+encodeURIComponent(p.address),'_blank');
  }catch(err){alert('네이버지도 연결 준비 중 오류가 발생했습니다.\n\n'+err.message)}
 })();
}

 }else{

function moveRoute(id,dir){
 const i=routeSelection.indexOf(String(id));if(i<0)return;
 const j=i+dir;if(j<0||j>=routeSelection.length)return;
 [routeSelection[i],routeSelection[j]]=[routeSelection[j],routeSelection[i]];
 saveCurrentRoute();
 renderRoutePeopleList();
 drawRouteResult();
}
function getRoutePeople(){return routeSelection.map(id=>state.people.find(p=>String(p.id)===String(id))).filter(Boolean)}
function routeModeLabel(mode){
 if(mode==='far')return '📍 현재 위치 기준 먼 순서 · 직선거리';

function renderSavedRouteCard(){
 const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
 const rt=r&&r.route;
 if(!rt||!Array.isArray(rt.ids)||!rt.ids.length)return '';
 const people=rt.ids.map(id=>state.people.find(p=>String(p.id)===String(id))).filter(Boolean);
 if(!people.length)return '';
 const next=people.findIndex(p=>!routeIsChecked(p.id));
 return `<div class="card" style="background:#f8faff;border:1px solid #dfe7f5;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>🚗 현재 동선</b><div class="muted" style="margin-top:4px">${esc(routeModeLabel(rt.mode))}</div></div><button class="small" onclick="openSavedRoute()">동선 보기</button></div><div style="margin-top:10px">${people.map((p,i)=>{const done=routeIsChecked(p.id);const isNext=!done&&i===next;return `<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #e8edf5"><span class="route-number" style="width:26px;height:26px;font-size:12px">${i+1}</span><div style="min-width:0;flex:1"><b class="${done?'route-done':''}">${done?'✓ ':''}${esc(p.name)}${isNext?' · 다음 방문':''}</b><span class="route-address">${rt.distances&&rt.distances[String(p.id)]!=null?('약 '+Number(rt.distances[String(p.id)]).toFixed(2)+' km · '):''}${esc(p.address||'주소 없음')}</span></div>${isNext?`<button class="small primary" onclick="openNaverCarRouteById('${String(p.id).replace(/'/g,"\'")}')">🧭 길찾기</button>`:''}</div>`}).join('')}</div></div>`;
}
function openSavedRoute(){
 const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
 const rt=r&&r.route;
 if(!rt||!rt.ids||!rt.ids.length){alert('저장된 동선이 없습니다.');return}
 routeSelection=rt.ids.map(String).filter(id=>state.people.some(p=>String(p.id)===id));
 routeDistances={...(rt.distances||{})};
 routeMode=rt.mode||'near';
 routeCoords=rt.coords||null;
 const radios=document.querySelectorAll('input[name="routeMode"]');
 radios.forEach(el=>el.checked=(el.value===routeMode));
 setRouteMode(routeMode);
 renderRoutePeopleList();

 drawRouteResult();

 document.getElementById('routeModal').style.display='flex';document.body.classList.add('route-open');

function requestRouteLocation(){
 const el=document.getElementById('routeLocation');
 if(!navigator.geolocation){el.textContent='이 기기에서는 현재 위치 기능을 사용할 수 없습니다.';return}
 el.textContent='📍 현재 위치를 확인하고 있습니다...';
 navigator.geolocation.getCurrentPosition(pos=>{
  routeCoords={lat:pos.coords.latitude,lon:pos.coords.longitude};
  el.textContent=`📍 현재 위치 확인됨 · ${routeCoords.lat.toFixed(5)}, ${routeCoords.lon.toFixed(5)}`;
 },err=>{el.textContent='현재 위치를 확인하지 못했습니다. 위치 권한을 허용해 주세요.';}, {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
async function buildRouteList(){
 if(!routeSelection.length){alert('방문할 대상자를 한 명 이상 선택하세요.');return}
 if(routeMode==='selected'){
  routeDistances={};
  saveCurrentRoute();
  document.getElementById('routeResultLocation').textContent='☑️ 선택한 순서 그대로 표시했습니다.';
  drawRouteResult();
  document.getElementById('routeResultPanel').classList.add('show');
  const closeBtn=document.getElementById('routeCloseBtn');if(closeBtn)closeBtn.textContent='동선 완료';
  showRouteSuccessToast();
  return;
 }
 if(!routeCoords){alert('먼저 📍 현재 위치 확인을 눌러 출발 위치를 확인하세요.');return}
 const people=getRoutePeople();
 if(!confirm('가까운 순서/먼 순서를 만들려면 선택한 대상자의 주소를 외부 지도 서비스에 보내 위치를 확인해야 합니다.\n\n주소만 전송하며 이름·전화번호·메모는 전송하지 않습니다.\n\n외부 전송 없이 방문순서를 만들려면 ‘선택한 순서’를 이용하세요.\n\n계속할까요?')) return;
 const noAddress=people.filter(p=>!String(p.address||'').trim());
 if(noAddress.length){alert('다음 대상자는 주소가 없어 거리 계산을 할 수 없습니다.\n\n'+noAddress.map(p=>p.name).join(', ')+'\n\n주소를 입력한 뒤 다시 시도하세요.');return}
 const btn=document.querySelector('#routeModal button.primary');
 if(btn){btn.disabled=true;btn.textContent='주소 위치 확인 중…'}
 document.getElementById('routeLocation').textContent='📍 현재 위치 확인됨 · 선택 대상자의 위치를 확인하고 있습니다...';
 try{
  const rows=[];
  for(let i=0;i<people.length;i++){
   const p=people[i];
   const coord=await geocodeAddress(p.address);
   if(!coord)throw new Error(p.name+'님의 주소를 지도 좌표로 찾지 못했습니다.\n주소: '+p.address);
   const km=haversineKm(routeCoords,coord);
   routeDistances[String(p.id)]=km;
   rows.push({p,km});
   if(i<people.length-1)await sleep(1100);
  }
  rows.sort((a,b)=>routeMode==='near'?(a.km-b.km):(b.km-a.km));
  routeSelection=rows.map(x=>String(x.p.id));
  saveCurrentRoute();
  renderRoutePeopleList();
  document.getElementById('routeResultLocation').textContent=routeModeLabel(routeMode);
  drawRouteResult();
  document.getElementById('routeResultPanel').classList.add('show');
  const closeBtn=document.getElementById('routeCloseBtn');if(closeBtn)closeBtn.textContent='동선 완료';
  showRouteSuccessToast();
 }catch(err){
  alert('동선 계산을 완료하지 못했습니다.\n\n'+err.message+'\n\n주소가 정확한지 확인한 뒤 다시 시도하세요.');
 }finally{
  if(btn){btn.disabled=false;btn.textContent='방문순서 만들기'}
  document.getElementById('routeLocation').textContent=routeCoords?`📍 현재 위치 확인됨 · ${routeCoords.lat.toFixed(5)}, ${routeCoords.lon.toFixed(5)}`:'현재 위치를 확인해 주세요.';
 }
}
function drawRouteResult(){
 const box=document.getElementById('routeResult');if(!box)return;

 if(!people.length){box.innerHTML='<div class="muted">선택한 대상자가 없습니다.</div>';return}

 box.innerHTML=people.map((p,i)=>{const done=routeIsChecked(p.id);const isNext=!done&&i===next;return `<div class="route-result"><div class="route-number">${i+1}</div><div style="min-width:0;flex:1"><b class="${done?'route-done':''}">${done?'✓ ':''}${esc(p.name)}${isNext?' · 다음 방문':''}</b><span class="route-address">${routeDistances[String(p.id)]!=null?('약 '+routeDistances[String(p.id)].toFixed(2)+' km · '):''}${esc(p.phone||'')}${p.address?' · '+esc(p.address):'주소 없음'}</span></div>${isNext?`<button class="small primary" onclick="openNaverCarRouteById('${String(p.id).replace(/'/g,"\'")}')">🧭 길찾기</button>`:''}<div class="route-updown"><button onclick="moveRoute('${String(p.id).replace(/'/g,"\'")}',-1)" aria-label="위로">↑</button><button onclick="moveRoute('${String(p.id).replace(/'/g,"\'")}',1)" aria-label="아래로">↓</button></div></div>`}).join('');

function renderRecords(){
 main.innerHTML=`<div class="records-screen"><div class="records-topbar"><div class="records-heading">목록</div></div><div class="records-list" id="records"></div></div>`;
 const box=document.getElementById('records');
 if(!state.records.length){box.innerHTML='<div class="card"><div class="muted">저장된 기록이 없습니다.</div></div>';return}
 state.records.slice().reverse().forEach(r=>{

  const d=document.createElement('div');d.className='record-card';
  d.innerHTML=`<div class="record-title">${esc(r.title)}</div><div class="record-meta">${esc(r.date)} · ${n}명 / ${total}명 체크</div><div class="record-actions"><button class="primary">열기</button><button>📥 Excel</button><button class="danger">🗑 삭제</button></div>`;
  const b=d.querySelectorAll('button');
  b[0].onclick=()=>openRecord(r); b[1].onclick=()=>exportExcel(r); b[2].onclick=()=>{
   if(!confirm('이 기록을 휴지통으로 이동할까요?\n기록은 휴지통에서 복원할 수 있습니다.'))return;
   const idx=state.records.findIndex(x=>x.id===r.id); if(idx<0)return;
   const moved=JSON.parse(JSON.stringify(state.records[idx])); moved.deletedAt=new Date().toISOString();
   state.trash.push(moved); state.records.splice(idx,1); if(activeRecordId===r.id)activeRecordId=null; save(); render(); toast('기록을 휴지통으로 이동했습니다.');
  };
  box.appendChild(d);
 });
}
function openRecord(r){
 const target=state.records.find(x=>x.id===r.id);
 if(!target){alert('이 기록을 찾을 수 없습니다.');return}
 activeRecordId=target.id;
 state.title=target.title||'기타';
 state.topicType=target.topicType||inferTopicType(state.title);
 state.date=target.date||new Date().toISOString().slice(0,10);
 if(Array.isArray(target.people) && target.people.length){
   state.people=target.people.map(p=>({...p}));
 }else if(state.people.length){
   target.people=state.people.map(p=>({...p}));
 }else{
   // 명단이 전혀 없는 구버전 기록은 기록을 열 수는 있지만
   // 현재 화면에서 복원할 명단이 없으므로 안내한다.
   target.people=[];
 }
 query='';
 deleteMode=false;
 deleteSelected=new Set();
 save();
 const dp=document.getElementById('datePicker');if(dp)dp.value=state.date;
 tab='check';
 render();
 toast('기록을 열었습니다. 수정 후 체크하면 저장됩니다.');
}
async function exportExcel(r){
 const rows=[['연번','이름','생년월일','전화번호','주소',r.title+' ('+r.date+')']];
 const people=r.people||state.people;
 people.forEach((p,i)=>{
  const cv=r.checks[p.id];
  const info=parseCheck(cv);
  let value='';
  if(cv===true)value='O';
  else if(typeof cv==='string')value=cv;
  else if(cv && typeof cv==='object')value=info.relation+(info.time?' · '+info.time:'');
  rows.push([i+1,p.name,p.birth||'',p.phone||'',p.address||'',value]);
});
 const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'기록');
 const filename=(r.title+'_'+r.date).replace(/[\\/:*?"<>|]/g,'_')+'.xlsx';
 const data=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 const blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const file=new File([blob],filename,{type:blob.type});

 // 모바일에서는 생성한 Excel 파일을 운영체제 공유창으로 전달
 if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
   try{
     await navigator.share({title:filename,text:'복지 체크북 기록',files:[file]});
     return;
   }catch(err){
     if(err && err.name==='AbortError')return;
   }
 }
 // 공유 기능을 지원하지 않는 브라우저는 다운로드로 대체
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
async function shareApp(){
 const appUrl='https://meeting-checkbook.vercel.app/';
 const shareData={title:'방문 체크북',text:'사회복지 업무용 방문·상담 기록 앱',url:appUrl};
 try{
   if(navigator.share){
     await navigator.share(shareData);
     return;
   }
 }catch(e){
   if(e && e.name==='AbortError') return;
 }
 try{
   if(navigator.clipboard && window.isSecureContext){
     await navigator.clipboard.writeText(appUrl);
     toast('✓ 앱 주소가 복사되었습니다.');
     return;
   }
 }catch(e){}
 const ta=document.createElement('textarea');
 ta.value=appUrl;ta.style.position='fixed';ta.style.left='-9999px';
 document.body.appendChild(ta);ta.select();
 try{document.execCommand('copy');toast('✓ 앱 주소가 복사되었습니다.');}
 catch(e){prompt('앱 주소를 복사하세요.',appUrl);}
 ta.remove();
}

function openManageDetail(type){
 const m=document.getElementById('manageDetailModal'); if(!m)return; const t=document.getElementById('manageDetailTitle'),b=document.getElementById('manageDetailBody'); let h='';
 if(type==='lock'){t.textContent='앱 잠금';h=`<p class="muted">${security.enabled?'현재 숫자 4자리 비밀번호 보호가 사용 중입니다.':'현재 비밀번호 없이 사용 중입니다.'}</p>${security.enabled?`<div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="changePassword();closeManageDetail()">비밀번호 변경</button><button onclick="lockApp();closeManageDetail()">🔒 지금 잠그기</button></div><button class="danger" style="width:100%;margin-top:8px" onclick="disablePassword();closeManageDetail()">🔓 비밀번호 사용 안 함</button>`:`<button class="primary" style="width:100%" onclick="startPasswordSetup();closeManageDetail()">🔒 비밀번호 사용</button>`}`}
 else if(type==='share'){t.textContent='앱 공유';h=`<p class="muted">대상자 자료는 공유하지 않고 방문 체크북 앱 주소만 공유합니다.</p><button class="primary" style="width:100%" onclick="shareApp();closeManageDetail()">📤 앱 주소 공유</button>`}
 else if(type==='help'){t.textContent='사용 안내';h=`<div class="help-body"><b>① 새 체크북 만들기</b><br>홈의 새 방문기록에서 업무 주제를 선택하고 명단을 불러오거나 직접 추가합니다.<br><br><b>② 대상자 체크</b><br>체크 메뉴에서 이름을 검색하거나 음성으로 찾아 체크합니다.<br><br><b>③ 동선 만들기</b><br>방문할 사람을 선택하고 방문 순서를 정합니다.<br><br><b>④ 개인정보 보호</b><br>명단과 기록은 기본적으로 이 기기의 브라우저 저장공간에 보관됩니다.</div>`}
 else if(type==='data'){t.textContent='데이터 관리';h=`<p class="muted">명단과 기록은 원칙적으로 이 기기의 브라우저 저장공간에 보관됩니다.</p><div class="actions" style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="document.getElementById('excelFile')?.click();closeManageDetail()">📥 명단 가져오기</button><button onclick="exportCurrentRecord();closeManageDetail()">📤 기록 내보내기</button></div><input id="excelFile" type="file" accept=".xlsm,.xlsx,.xls" style="display:none" onchange="importExcel()">`}
 else if(type==='trash'){const tr=Array.isArray(state.trash)?state.trash:[];const list=!tr.length?'<div class="muted">휴지통이 비어 있습니다.</div>':tr.slice().reverse().map(r=>`<div class="record"><b>${esc(r.title)}</b><div class="muted">${esc(r.date)}</div><div class="actions" style="margin-top:8px"><button class="small" onclick="restoreTrash('${String(r.id).replace(/'/g,"\\'")}');closeManageDetail()">↩ 복원</button><button class="small danger" onclick="permanentDeleteTrash('${String(r.id).replace(/'/g,"\\'")}');closeManageDetail()">영구 삭제</button></div></div>`).join('');t.textContent='휴지통';h=`<p class="muted">삭제된 기록은 휴지통에 보관됩니다.</p>${list}${tr.length?'<button style="width:100%;margin-top:10px" onclick="emptyTrash();closeManageDetail()">휴지통 비우기</button>':''}`}
 else if(type==='reset'){t.textContent='초기화';h=`<p class="muted">모든 명단과 기록, 휴지통을 포함한 앱 데이터를 삭제합니다.</p><div class="warn">삭제한 데이터는 되돌릴 수 없습니다.</div><button class="danger" style="width:100%" onclick="resetAll();closeManageDetail()">모든 데이터 초기화</button>`}

function exportCurrentRecord(){const r=getRecord(false);if(!r||!(r.people||[]).length){alert('내보낼 기록이 없습니다.');return}exportExcel(r)}
function restoreTrash(id){
 const idx=state.trash.findIndex(x=>String(x.id)===String(id));
 if(idx<0){alert('휴지통에서 기록을 찾을 수 없습니다.');return}
 const r=JSON.parse(JSON.stringify(state.trash[idx]));
 delete r.deletedAt;
 if(state.records.some(x=>String(x.id)===String(r.id))){r.id=crypto.randomUUID()}
 state.records.push(r);
 state.trash.splice(idx,1);
 save();render();toast('기록을 복원했습니다.');
}
function permanentDeleteTrash(id){
 const idx=state.trash.findIndex(x=>String(x.id)===String(id));
 if(idx<0)return;
 if(!confirm('이 기록을 영구적으로 삭제할까요?\n영구 삭제 후에는 복원할 수 없습니다.'))return;
 state.trash.splice(idx,1);
 save();render();toast('기록을 영구 삭제했습니다.');
}
function emptyTrash(){
 if(!state.trash.length)return;
 if(!confirm(`휴지통의 ${state.trash.length}개 기록을 모두 영구 삭제할까요?\n삭제 후에는 복원할 수 없습니다.`))return;
 state.trash=[];save();render();toast('휴지통을 비웠습니다.');
}
function resetAll(){if(confirm('모든 명단과 기록을 삭제할까요?')){localStorage.removeItem(KEY);localStorage.removeItem(LOCK_KEY);localStorage.removeItem(GEOCODE_CACHE_KEY);location.reload()}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',1500)}
bootSecurity();
setTimeout(()=>document.getElementById('splash')?.classList.add('hide'),1300);
