<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<link rel="manifest" href="manifest.json">
<title>만남 체크북 2.0</title>
<style>
.call{display:inline-flex;text-decoration:none;align-items:center;justify-content:center;min-width:42px;}
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182235;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #00000012}
header{padding:16px 18px 14px;background:#4f7cff;color:white;position:sticky;top:0;z-index:5}
.title{font-size:21px;font-weight:800}.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar input{flex:1;border:0;border-radius:10px;padding:9px;background:#fff;color:#182235;font-weight:700}
main{padding:15px 15px 92px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:14px;margin-bottom:12px}
.summary{background:#f5f7ff;border-radius:18px;padding:15px;margin-bottom:12px}.summaryrow{display:flex;justify-content:space-between;align-items:end}
.count{font-size:26px;font-weight:800}.muted{color:#718096;font-size:13px}.progress{height:8px;background:#e5eaf5;border-radius:99px;margin-top:11px;overflow:hidden}.bar{height:100%;background:#4f7cff;border-radius:99px;width:0}
input[type=text],input[type=file],select{width:100%;padding:13px;border:1px solid #dbe2ef;border-radius:13px;font-size:16px;background:#fff}
button{border:0;border-radius:11px;padding:10px 12px;font-weight:750;color:#182235;background:#edf1f7}
.primary{background:#182235;color:#fff}.voice{width:100%;background:#182235;color:#fff;padding:14px;font-size:16px;margin:10px 0}
.searchrow{display:flex;gap:7px}.searchrow input{flex:1}.mic{font-size:20px;padding:9px 13px;background:#eef5ff;color:#155eef}
.list{margin-top:10px}.person{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf0f5}.person.delete-mode{grid-template-columns:32px 32px 1fr}.person.delete-mode .name{min-width:0}.person.delete-mode .actions{display:none}
.num{color:#182235;font-size:14px;font-weight:800;text-align:right;min-width:30px;padding-right:2px}.name{font-weight:700}.birth{display:block;color:#8a95a8;font-size:12px;margin-top:3px}
.actions{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;justify-content:flex-end}.actions button,.actions select{flex:none}.actions select{max-width:86px}.status{min-width:62px}.compact{white-space:nowrap;min-width:auto}.memo{background:#f5f7ff;color:#40506b}.memo.has{background:#fff3cd;color:#7a5600}.off{background:#f0f2f6;color:#7a8495}.on{background:#dff7e8;color:#198754}.call{background:#edf8f1;color:#167044;padding:9px}
.warn{background:#fff7e6;color:#946200;padding:10px;border-radius:10px;font-size:13px;margin:8px 0}.ok{background:#edf8f1;color:#167044;padding:10px;border-radius:10px;font-size:13px;margin:8px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid #e6eaf1;display:flex;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;font-size:11px;padding:7px 2px;color:#6d7788}nav button.active{color:#4f7cff;font-weight:800}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:min(560px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow-y:auto;-webkit-overflow-scrolling:touch}.result{padding:13px;border:1px solid #e2e7f0;border-radius:12px;margin:8px 0}.close{width:100%;margin-top:10px}.record{padding:12px 0;border-bottom:1px solid #edf0f5}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#182235;color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:30;white-space:nowrap}
.small{font-size:12px;padding:7px 9px}.danger{background:#fff0f0;color:#b42318}
.route-person{display:flex;align-items:center;gap:9px;padding:10px 4px;border-bottom:1px solid #edf0f5}.route-person input{width:22px;height:22px;flex:none}.route-order{display:inline-flex;width:26px;height:26px;border-radius:50%;align-items:center;justify-content:center;background:#eef2f8;font-weight:800;font-size:12px}.route-result{display:flex;gap:10px;align-items:flex-start;padding:12px 4px;border-bottom:1px solid #edf0f5}.route-number{width:30px;height:30px;border-radius:50%;background:#182235;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;flex:none}.route-updown{display:flex;gap:5px;margin-left:auto}.route-updown button{padding:6px 8px}.route-address{display:block;color:#718096;font-size:12px;margin-top:3px}.route-mode{display:grid;grid-template-columns:1fr;gap:7px;margin:10px 0}.route-mode label{display:flex;align-items:center;gap:9px;padding:11px 12px;border:1px solid #dbe2ef;border-radius:12px;background:#f8fafc;font-weight:700}.route-mode input{width:20px;height:20px;margin:0}.route-mode .hint{font-size:11px;font-weight:500;color:#718096;margin-left:auto}.route-result-panel{display:none;margin-top:12px;padding:13px;border:2px solid #dbe3f1;border-radius:16px;background:#f8faff}.route-result-panel.show{display:block}.route-result-title{font-size:16px;font-weight:800;margin-bottom:5px}.route-result-sub{font-size:12px;color:#718096;margin-bottom:8px}.route-switch{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.route-done{color:#198754;font-weight:800}.route-next{background:#eaf2ff;color:#155eef;font-weight:800}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="title">📋 만남 체크북</div>
 <div class="datebar"><input id="datePicker" type="date"><span>날짜</span></div>
</header>
<main id="main"></main>
<nav>
 <button id="navNew" onclick="newTopic()">🆕<br>NEW</button>
 <button id="navCheck" onclick="tab='check';render()">📋<br>체크</button>
 <button id="navRecords" onclick="tab='records';render()">🗂<br>목록</button>
 <button id="navManage" onclick="tab='manage';render()">⚙<br>관리</button>
</nav>
</div>
<div class="modal" id="voiceModal"><div class="sheet">
 <h2>🎤 음성 체크</h2><div id="voiceMsg">이름을 말씀하세요.</div><div id="voiceResults"></div>
 <button class="close" onclick="closeVoice()">닫기</button>
</div></div>
<div class="modal" id="addModal"><div class="sheet">
 <h2>＋ 대상자 추가</h2>
 <input id="addName" type="text" placeholder="이름">
 <input id="addBirth" type="text" placeholder="생년월일 (예: 1950-05-08)" style="margin-top:8px">
 <input id="addPhone" type="text" placeholder="전화번호" style="margin-top:8px">
 <input id="addAddress" type="text" placeholder="주소" style="margin-top:8px">
 <button class="primary" style="width:100%;margin-top:10px" onclick="addPerson()">명단에 추가</button>
 <button class="close" onclick="closeAdd()">취소</button>
</div></div>
<div class="modal" id="memoModal"><div class="sheet">
 <h2>📝 메모</h2><div id="memoPerson" class="muted" style="margin-bottom:8px"></div>
 <textarea id="memoText" rows="4" style="width:100%;padding:12px;border:1px solid #dbe2ef;border-radius:13px;font-size:16px;resize:vertical" placeholder="간단한 메모를 입력하세요."></textarea>
 <button class="primary" style="width:100%;margin-top:10px" onclick="saveMemo()">저장</button>
 <button class="close" onclick="closeMemo()">취소</button>
</div></div>
<div class="modal" id="specialModal"><div class="sheet">
 <h2>체크 정보</h2><div id="specialPerson" class="muted" style="margin-bottom:8px"></div>
 <select id="specialRelation"><option value="">체크하지 않음</option><option value="본인">본인</option><option value="가족">가족</option><option value="기타">기타</option></select>
 <div style="display:flex;gap:8px;margin-top:8px"><select id="specialHour"><option value="">시</option></select><select id="specialMinute"><option value="">분</option></select></div>
 <button class="primary" style="width:100%;margin-top:10px" onclick="saveSpecialModal()">저장</button>
 <button class="close" onclick="closeSpecialModal()">취소</button>
</div></div>
<div class="modal" id="newModal"><div class="sheet">
 <h2>🆕 새로운 체크북</h2>
 <p class="muted">업무 주제를 선택하면 주제에 맞는 체크 방식으로 시작합니다.</p>
 <select id="newTopicType" onchange="updateNewTopicUI()"><option value="방문상담">방문상담</option><option value="물품수령">물품수령</option><option value="출석체크">출석체크</option><option value="안부확인">안부확인</option><option value="기타">기타</option></select>
 <input id="newTitle" type="text" placeholder="기타 주제명" style="margin-top:8px;display:none">
 <input id="newFile" type="file" accept=".xlsm,.xlsx,.xls" style="margin-top:8px">
 <button class="primary" style="width:100%;margin-top:8px" onclick="createNewTopic()">새 체크북 시작</button>
 <button class="close" onclick="closeNew()">취소</button>
</div></div>
<div class="modal" id="routeModal"><div class="sheet">
 <div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2 style="margin:0">🚗 동선 만들기</h2><button class="small" onclick="goCheckFromRoute()">☑ 체크 화면</button></div>
 <div id="routeLocation" class="muted" style="margin-bottom:8px">순서를 정할 기준을 선택하세요.</div>
 <div class="route-mode">
  <label><input type="radio" name="routeMode" value="near" checked onchange="setRouteMode(this.value)"><span>📍 가까운 순서</span><span class="hint">현재 위치 기준</span></label>
  <label><input type="radio" name="routeMode" value="far" onchange="setRouteMode(this.value)"><span>📍 먼 순서</span><span class="hint">현재 위치 기준</span></label>
  <label><input type="radio" name="routeMode" value="selected" onchange="setRouteMode(this.value)"><span>☑️ 선택한 순서</span><span class="hint">거리 계산 없음</span></label>
 </div>
 <button id="routeLocationBtn" style="width:100%;margin-bottom:10px">📍 현재 위치 확인</button>
 <div id="routeModeHelp" class="warn">가까운 순서·먼 순서는 현재 위치와 대상자 주소의 직선거리를 계산합니다. 선택한 순서는 대상자를 체크한 순서 그대로 사용합니다.</div>
 <div id="routePeople"></div>
 <div id="routeResultPanel" class="route-result-panel">
  <div class="route-result-title">🚗 만들어진 방문순서</div><div class="muted" style="margin-bottom:8px">↑ ↓ 버튼으로 방문순서를 직접 변경할 수 있습니다.</div>
  <div id="routeResultLocation" class="route-result-sub"></div>
  <div id="routeResult"></div>
 </div>
 <div class="route-switch"><button onclick="goCheckFromRoute()">☑ 체크 화면으로</button><button onclick="closeRoute()" id="routeCloseBtn">동선 완료</button></div>
 <div class="actions" style="display:grid;grid-template-columns:1fr;gap:8px;margin-top:8px">
  <button class="primary" onclick="buildRouteList()">방문순서 만들기</button>
 </div>
 </div></div>

<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const KEY='welfare_checkbook_from_attendance_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 people:[
  {id:'1',name:'김창억',birth:'1949-05-01',phone:'',address:''},{id:'2',name:'박수직',birth:'1951-04-11',phone:'',address:''},
  {id:'3',name:'조강하',birth:'1956-05-01',phone:'',address:''},{id:'4',name:'구조대',birth:'1948-07-05',phone:'',address:''},
  {id:'5',name:'구조대',birth:'1950-05-08',phone:'',address:''},{id:'6',name:'한사방',birth:'1952-02-17',phone:'',address:''},
  {id:'7',name:'고용대',birth:'1955-10-03',phone:'',address:''},{id:'8',name:'최수몽',birth:'1958-12-22',phone:'',address:''}
 ],records:[],trash:[],title:'출석체크',topicType:'출석체크',date:new Date().toISOString().slice(0,10)
};
if(!Array.isArray(state.trash)) state.trash=[];
let tab='check',query='',deleteMode=false,deleteSelected=new Set(),activeRecordId=null,memoPersonId=null,specialPersonId=null;

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nameNorm(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
function phoneNorm(s){return String(s||'').replace(/[^\d+]/g,'')}
function birthNorm(v){
 if(v===null||v===undefined||v==='')return '';
 if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
 let s=String(v).trim().replace(/\s/g,'');
 let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
 if(/^\d{6}$/.test(s)){let yy=+s.slice(0,2);return (yy<=25?2000+yy:1900+yy)+'-'+s.slice(2,4)+'-'+s.slice(4,6)}
 let n=Number(s);if(isFinite(n)&&n>20000&&n<70000){let d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
 return s
}
function birth6(b){let m=String(b||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[1].slice(2)+m[2]+m[3]:b||''}
function getRecord(create=true){
 let r=activeRecordId ? state.records.find(x=>x.id===activeRecordId) : state.records.find(x=>x.date===state.date&&x.title===state.title);
 if(!r&&create){
  r={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:state.people.map(p=>({...p}))};
  state.records.push(r);activeRecordId=r.id;
 }
 if(r){
  state.date=r.date||state.date;
  state.title=r.title||state.title||'기타';
  state.topicType=r.topicType||inferTopicType(state.title);
  // 기록에 명단이 있으면 반드시 그 명단을 현재 화면으로 복원한다.
  // 구버전 기록에 명단이 없으면 현재 명단을 기록에 스냅샷으로 저장한다.
  if(Array.isArray(r.people) && r.people.length){
    state.people=r.people.map(p=>({...p}));
  }else if(state.people.length){
    r.people=state.people.map(p=>({...p}));
  }
 }
 return r
}
function checkedSet(){let r=getRecord(false);return new Map(r?Object.keys(r.checks).filter(k=>r.checks[k]).map(k=>[k,r.checks[k]]):[])}
function specialTopic(){return ['방문상담','물품수령','안부확인'].includes(state.topicType)}
function parseCheck(v){
 if(v && typeof v==='object') return {relation:v.relation||'',time:v.time||'',memo:v.memo||'',checked:v.checked!==false};
 if(typeof v==='string' && ['본인','가족','기타'].includes(v)) return {relation:v,time:'',memo:'',checked:true};
 if(v===true) return {relation:'',time:'',memo:'',checked:true};
 return {relation:'',time:'',memo:'',checked:false};
}
function setSpecialCheck(id,relation,hour,minute){
 let r=getRecord();
 const time=(hour&&minute)?hour+':'+minute:'';
 const old=parseCheck(r.checks[id]);
 if(!relation){delete r.checks[id];}
 else{r.checks[id]={relation,time,memo:old.memo||'',checked:true};}
 r.people=state.people.map(p=>({...p}));
 save();render();toast(relation?relation+(time?' · '+time:'')+'로 체크되었습니다.':'체크가 취소되었습니다.');
}
function updateSpecialTime(id){
 const r=getRecord();
 const info=parseCheck(r?.checks?.[id]);
 if(!info.relation)return;
 const h=document.getElementById('tmh_'+String(id)),m=document.getElementById('tmm_'+String(id));
 const time=h?.value&&m?.value?h.value+':'+m.value:'';
 r.checks[id]={relation:info.relation,time,memo:info.memo||'',checked:true};
 r.people=state.people.map(p=>({...p}));
 save();
 toast(time?'만난 시간이 저장되었습니다.':'만난 시간이 해제되었습니다.');
}
function setVisitType(id,value){setSpecialCheck(id,value,'')}
function toggle(id){
 let r=getRecord(),s=checkedSet();
 r.people=state.people.map(p=>({...p}));
 if(s.has(String(id))){delete r.checks[id];toast('체크가 취소되었습니다.')}
 else{r.checks[id]={checked:true,memo:''};toast('✓ 체크되었습니다.')}
 query='';
 save();
 render();
}
function setNav(){['Check','Records','Manage'].forEach(x=>document.getElementById('nav'+x).classList.toggle('active',tab===x.toLowerCase()));document.getElementById('navNew').classList.remove('active')}
function inferTopicType(title){const t=String(title||'');if(['방문상담','물품수령','출석체크','안부확인'].includes(t))return t;if(t==='출석')return '출석체크';return '기타'}
function updateNewTopicUI(){const type=document.getElementById('newTopicType')?.value||'기타';const input=document.getElementById('newTitle');if(!input)return;input.style.display=type==='기타'?'block':'none';if(type!=='기타')input.value=type}
function newTopic(){
 activeRecordId=null;
 document.getElementById('newTopicType').value='방문상담';
 document.getElementById('newTitle').value='';
 document.getElementById('newFile').value='';
 updateNewTopicUI();
 document.getElementById('newModal').style.display='flex';
 document.getElementById('newTitle').focus();
}
function closeNew(){document.getElementById('newModal').style.display='none'}
function createNewTopic(){
 const topicType=document.getElementById('newTopicType').value;
 const customTitle=document.getElementById('newTitle').value.trim();
 const title=topicType==='기타'?(customTitle||'기타'):topicType;
 const f=document.getElementById('newFile').files[0];
 if(!title){alert('새로운 주제명을 입력하세요.');return}
 if(!f){
   state.people=[];
   state.title=title;
   state.topicType=topicType;
   state.date=new Date().toISOString().slice(0,10);
   query='';
   deleteMode=false;
   deleteSelected=new Set();
   const nr={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:[]};
   state.records.push(nr);
   activeRecordId=nr.id;
   save();
   closeNew();
   tab='check';
   document.getElementById('datePicker').value=state.date;
   render();
   toast('새 체크북이 시작되었습니다 · 화면에서 명단을 추가하세요');
   return;
 }
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   let h=rows.findIndex(row=>row.some(v=>['이름','성명','대상자명','대상자'].includes(String(v).trim())));
   if(h<0)h=5;
   const heads=rows[h].map(v=>String(v).trim());
   let ni=heads.findIndex(v=>['이름','성명','대상자명','대상자'].includes(v));if(ni<0)ni=1;
   let bi=heads.findIndex(v=>v.includes('생년'));if(bi<0)bi=2;
   let pi=heads.findIndex(v=>v.includes('전화')||v.includes('휴대'));if(pi<0)pi=3;
   const people=[];
   rows.slice(h+1).forEach(row=>{
    const name=String(row[ni]??'').trim();if(!name)return;
    let ai=heads.findIndex(v=>v.includes('주소')||v.includes('거주지')||v.includes('도로명')); if(ai<0)ai=4;
    people.push({id:crypto.randomUUID(),name,birth:birthNorm(row[bi]),phone:String(row[pi]??'').trim(),address:String(row[ai]??'').trim()});
   });
   if(!people.length){alert('Excel에서 대상자 명단을 찾지 못했습니다.');return}
   state.people=people;
   state.title=title;
   state.topicType=topicType;
   state.date=new Date().toISOString().slice(0,10);
   query='';

function importExcel(){

 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   let h=rows.findIndex(row=>row.some(v=>['이름','성명','대상자명','대상자'].includes(String(v).trim())));if(h<0)h=5;
   const heads=rows[h].map(v=>String(v).trim());
   let ni=heads.findIndex(v=>['이름','성명','대상자명','대상자'].includes(v));if(ni<0)ni=1;
   let bi=heads.findIndex(v=>v.includes('생년'));if(bi<0)bi=2;
   let pi=heads.findIndex(v=>v.includes('전화')||v.includes('휴대'));if(pi<0)pi=3;
   let ai=heads.findIndex(v=>v.includes('주소')||v.includes('거주지')||v.includes('도로명'));if(ai<0)ai=4;
   const people=[];rows.slice(h+1).forEach(row=>{const name=String(row[ni]??'').trim();if(!name)return;people.push({id:crypto.randomUUID(),name,birth:birthNorm(row[bi]),phone:String(row[pi]??'').trim(),address:String(row[ai]??'').trim()})});
   if(!people.length){alert('이름 열을 찾지 못했거나 명단이 없습니다.');return}
   state.people=people;
   const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
   if(r) r.people=people.map(p=>({...p}));
   save();query='';deleteMode=false;deleteSelected=new Set();tab='check';render();toast(people.length+'명 명단을 불러왔습니다.')
  }catch(err){alert('Excel 읽기 오류: '+err.message)}
 };reader.readAsArrayBuffer(f)
}

function loadGeocodeCache(){try{return JSON.parse(localStorage.getItem(GEOCODE_CACHE_KEY)||'{}')}catch(e){return {}}}
function saveGeocodeCache(c){localStorage.setItem(GEOCODE_CACHE_KEY,JSON.stringify(c))}
function sleep(ms){return new Promise(r=>setTimeout(r,ms))}
function haversineKm(a,b){
 const R=6371,rad=Math.PI/180;
 const dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;
 const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;
 return R*2*Math.atan2(Math.sqrt(x),Math.sqrt(1-x));
}
async function geocodeAddress(address){
 const cache=loadGeocodeCache();
 const key=String(address||'').trim();
 if(!key)return null;
 if(cache[key] && Number.isFinite(cache[key].lat) && Number.isFinite(cache[key].lon))return cache[key];
 const url='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&countrycodes=kr&accept-language=ko&q='+encodeURIComponent(key);
 const res=await fetch(url,{headers:{'Accept':'application/json'}});
 if(!res.ok)throw new Error('주소 검색 서버 응답 오류 ('+res.status+')');
 const data=await res.json();
 if(!Array.isArray(data)||!data.length)return null;
 const coord={lat:Number(data[0].lat),lon:Number(data[0].lon),display_name:data[0].display_name||''};
 if(!Number.isFinite(coord.lat)||!Number.isFinite(coord.lon))return null;
 cache[key]=coord;saveGeocodeCache(cache);
 return coord;
}

 (async()=>{

   const params='dlat='+encodeURIComponent(coord.lat)+'&dlng='+encodeURIComponent(coord.lon)+'&dname='+encodeURIComponent(p.name+' · '+p.address)+'&appname='+appName;
   const nmap='nmap://route/car?'+params;

 document.getElementById('routeModeHelp').innerHTML='<b>가까운 순서</b> 또는 <b>먼 순서</b>는 현재 위치와 대상자 주소의 직선거리를 계산합니다. 실제 도로 경로는 다음 단계에서 네이버지도로 연결합니다.';
 document.getElementById('routeModal').style.display='flex';
}
function closeRoute(){document.getElementById('routeModal').style.display='none'; render();}
function toggleRoutePerson(id,checked){
 id=String(id);
 if(checked){if(!routeSelection.includes(id))routeSelection.push(id)}else{routeSelection=routeSelection.filter(x=>x!==id)}
 renderRoutePeopleList();
 drawRouteResult();
}
function drawRouteOrder(){renderRoutePeopleList();}
function moveRoute(id,dir){
 const i=routeSelection.indexOf(String(id));if(i<0)return;
 const j=i+dir;if(j<0||j>=routeSelection.length)return;
 [routeSelection[i],routeSelection[j]]=[routeSelection[j],routeSelection[i]];
 saveCurrentRoute();
 renderRoutePeopleList();
 drawRouteResult();
}
function getRoutePeople(){return routeSelection.map(id=>state.people.find(p=>String(p.id)===String(id))).filter(Boolean)}
function routeModeLabel(mode){
 if(mode==='far')return '📍 현재 위치 기준 먼 순서 · 직선거리';
 if(mode==='selected')return '☑️ 선택한 순서';
 return '📍 현재 위치 기준 가까운 순서 · 직선거리';
}
function saveCurrentRoute(){
 let r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
 if(!r) r=getRecord(true);
 if(!r)return;
 r.route={ids:routeSelection.map(String),distances:{...routeDistances},mode:routeMode,coords:routeCoords?{lat:routeCoords.lat,lon:routeCoords.lon}:null,updatedAt:new Date().toISOString()};
 r.people=state.people.map(p=>({...p}));
 save();
}
function routeCheckInfo(id){
 const r=getRecord(false);
 return parseCheck(r?.checks?.[String(id)]);
}
function routeIsChecked(id){
 const r=getRecord(false);
 return !!(r?.checks?.[String(id)]);
}
function goCheckFromRoute(){
 document.getElementById('routeModal').style.display='none';
 tab='check';
 render();
}
function renderSavedRouteCard(){
 const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
 const rt=r&&r.route;
 if(!rt||!Array.isArray(rt.ids)||!rt.ids.length)return '';
 const people=rt.ids.map(id=>state.people.find(p=>String(p.id)===String(id))).filter(Boolean);
 if(!people.length)return '';
 const next=people.findIndex(p=>!routeIsChecked(p.id));
 return `<div class="card" style="background:#f8faff;border:1px solid #dfe7f5;margin-bottom:12px"><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><div><b>🚗 현재 동선</b><div class="muted" style="margin-top:4px">${esc(routeModeLabel(rt.mode))}</div></div><button class="small" onclick="openSavedRoute()">동선 보기</button></div><div style="margin-top:10px">${people.map((p,i)=>{const done=routeIsChecked(p.id);const isNext=!done&&i===next;return `<div style="display:flex;gap:8px;align-items:center;padding:7px 0;border-top:1px solid #e8edf5"><span class="route-number" style="width:26px;height:26px;font-size:12px">${i+1}</span><div style="min-width:0;flex:1"><b class="${done?'route-done':''}">${done?'✓ ':''}${esc(p.name)}${isNext?' · 다음 방문':''}</b><span class="route-address">${rt.distances&&rt.distances[String(p.id)]!=null?('약 '+Number(rt.distances[String(p.id)]).toFixed(2)+' km · '):''}${esc(p.address||'주소 없음')}</span></div>${isNext?`<button class="small primary" onclick="openNaverCarRouteById('${String(p.id).replace(/'/g,"\'")}')">🧭 길찾기</button>`:''}</div>`}).join('')}</div></div>`;
}
function openSavedRoute(){
 const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
 const rt=r&&r.route;
 if(!rt||!rt.ids||!rt.ids.length){alert('저장된 동선이 없습니다.');return}
 routeSelection=rt.ids.map(String).filter(id=>state.people.some(p=>String(p.id)===id));
 routeDistances={...(rt.distances||{})};
 routeMode=rt.mode||'near';
 routeCoords=rt.coords||null;
 const radios=document.querySelectorAll('input[name="routeMode"]');
 radios.forEach(el=>el.checked=(el.value===routeMode));
 setRouteMode(routeMode);
 renderRoutePeopleList();
 document.getElementById('routeResultLocation').textContent=routeModeLabel(routeMode);
 drawRouteResult();
 document.getElementById('routeResultPanel').classList.add('show');
 document.getElementById('routeModal').style.display='flex';
}
function requestRouteLocation(){
 const el=document.getElementById('routeLocation');
 if(!navigator.geolocation){el.textContent='이 기기에서는 현재 위치 기능을 사용할 수 없습니다.';return}
 el.textContent='📍 현재 위치를 확인하고 있습니다...';
 navigator.geolocation.getCurrentPosition(pos=>{
  routeCoords={lat:pos.coords.latitude,lon:pos.coords.longitude};
  el.textContent=`📍 현재 위치 확인됨 · ${routeCoords.lat.toFixed(5)}, ${routeCoords.lon.toFixed(5)}`;
 },err=>{el.textContent='현재 위치를 확인하지 못했습니다. 위치 권한을 허용해 주세요.';}, {enableHighAccuracy:true,timeout:10000,maximumAge:60000});
}
async function buildRouteList(){
 if(!routeSelection.length){alert('방문할 대상자를 한 명 이상 선택하세요.');return}
 if(routeMode==='selected'){
  routeDistances={};
  saveCurrentRoute();
  document.getElementById('routeResultLocation').textContent='☑️ 선택한 순서 그대로 표시했습니다.';
  drawRouteResult();
  document.getElementById('routeResultPanel').classList.add('show');
  const closeBtn=document.getElementById('routeCloseBtn');if(closeBtn)closeBtn.textContent='동선 완료';
  showRouteSuccessToast();
  return;
 }
 if(!routeCoords){alert('먼저 📍 현재 위치 확인을 눌러 출발 위치를 확인하세요.');return}
 const people=getRoutePeople();
 const noAddress=people.filter(p=>!String(p.address||'').trim());
 if(noAddress.length){alert('다음 대상자는 주소가 없어 거리 계산을 할 수 없습니다.\n\n'+noAddress.map(p=>p.name).join(', ')+'\n\n주소를 입력한 뒤 다시 시도하세요.');return}
 const btn=document.querySelector('#routeModal button.primary');
 if(btn){btn.disabled=true;btn.textContent='주소 위치 확인 중…'}
 document.getElementById('routeLocation').textContent='📍 현재 위치 확인됨 · 선택 대상자의 위치를 확인하고 있습니다...';
 try{
  const rows=[];
  for(let i=0;i<people.length;i++){
   const p=people[i];
   const coord=await geocodeAddress(p.address);
   if(!coord)throw new Error(p.name+'님의 주소를 지도 좌표로 찾지 못했습니다.\n주소: '+p.address);
   const km=haversineKm(routeCoords,coord);
   routeDistances[String(p.id)]=km;
   rows.push({p,km});
   if(i<people.length-1)await sleep(1100);
  }
  rows.sort((a,b)=>routeMode==='near'?(a.km-b.km):(b.km-a.km));
  routeSelection=rows.map(x=>String(x.p.id));
  saveCurrentRoute();
  renderRoutePeopleList();
  document.getElementById('routeResultLocation').textContent=routeModeLabel(routeMode);
  drawRouteResult();
  document.getElementById('routeResultPanel').classList.add('show');
  const closeBtn=document.getElementById('routeCloseBtn');if(closeBtn)closeBtn.textContent='동선 완료';
  showRouteSuccessToast();
 }catch(err){
  alert('동선 계산을 완료하지 못했습니다.\n\n'+err.message+'\n\n주소가 정확한지 확인한 뒤 다시 시도하세요.');
 }finally{
  if(btn){btn.disabled=false;btn.textContent='방문순서 만들기'}
  document.getElementById('routeLocation').textContent=routeCoords?`📍 현재 위치 확인됨 · ${routeCoords.lat.toFixed(5)}, ${routeCoords.lon.toFixed(5)}`:'현재 위치를 확인해 주세요.';
 }
}
function drawRouteResult(){
 const box=document.getElementById('routeResult');if(!box)return;
 const people=getRoutePeople();
 if(!people.length){box.innerHTML='<div class="muted">선택한 대상자가 없습니다.</div>';return}
 const next=people.findIndex(p=>!routeIsChecked(p.id));
 box.innerHTML=people.map((p,i)=>{const done=routeIsChecked(p.id);const isNext=!done&&i===next;return `<div class="route-result"><div class="route-number">${i+1}</div><div style="min-width:0;flex:1"><b class="${done?'route-done':''}">${done?'✓ ':''}${esc(p.name)}${isNext?' · 다음 방문':''}</b><span class="route-address">${routeDistances[String(p.id)]!=null?('약 '+routeDistances[String(p.id)].toFixed(2)+' km · '):''}${esc(p.phone||'')}${p.address?' · '+esc(p.address):'주소 없음'}</span></div>${isNext?`<button class="small primary" onclick="openNaverCarRouteById('${String(p.id).replace(/'/g,"\'")}')">🧭 길찾기</button>`:''}<div class="route-updown"><button onclick="moveRoute('${String(p.id).replace(/'/g,"\'")}',-1)" aria-label="위로">↑</button><button onclick="moveRoute('${String(p.id).replace(/'/g,"\'")}',1)" aria-label="아래로">↓</button></div></div>`}).join('');
}
document.getElementById('routeLocationBtn').onclick=requestRouteLocation;

function renderRecords(){
 main.innerHTML='<div class="card"><b>목록</b><p class="muted">체크북 목록을 확인하고 기존 목록을 열 수 있습니다.</p><div id="records"></div></div>';
 const box=document.getElementById('records');
 if(!state.records.length){box.innerHTML+='<div class="muted">저장된 기록이 없습니다.</div>';return}
 state.records.slice().reverse().forEach(r=>{
  const n=Object.values(r.checks||{}).filter(Boolean).length;
  const total=Array.isArray(r.people)&&r.people.length ? r.people.length : state.people.length;
  const d=document.createElement('div');d.className='record';
  d.innerHTML=`<b>${esc(r.title)}</b><div class="muted">${esc(r.date)} · ${n}명/${total}명 체크</div><div class="actions" style="margin-top:8px"><button class="small">열기</button><button class="small">📥 Excel</button><button class="small danger">🗑 삭제</button></div>`;
  const b=d.querySelectorAll('button');
  b[0].onclick=()=>openRecord(r);
  b[1].onclick=()=>exportExcel(r);
  b[2].onclick=()=>{
    if(!confirm('이 기록을 휴지통으로 이동할까요?\n기록은 휴지통에서 복원할 수 있습니다.'))return;
    const idx=state.records.findIndex(x=>x.id===r.id);
    if(idx<0)return;
    const moved=JSON.parse(JSON.stringify(state.records[idx]));
    moved.deletedAt=new Date().toISOString();
    state.trash.push(moved);
    state.records.splice(idx,1);
    if(activeRecordId===r.id)activeRecordId=null;
    save();render();toast('기록을 휴지통으로 이동했습니다.');
  };
  box.appendChild(d)
 })
}
function openRecord(r){
 const target=state.records.find(x=>x.id===r.id);
 if(!target){alert('이 기록을 찾을 수 없습니다.');return}
 activeRecordId=target.id;
 state.title=target.title||'기타';
 state.topicType=target.topicType||inferTopicType(state.title);
 state.date=target.date||new Date().toISOString().slice(0,10);
 if(Array.isArray(target.people) && target.people.length){
   state.people=target.people.map(p=>({...p}));
 }else if(state.people.length){
   target.people=state.people.map(p=>({...p}));
 }else{
   // 명단이 전혀 없는 구버전 기록은 기록을 열 수는 있지만
   // 현재 화면에서 복원할 명단이 없으므로 안내한다.
   target.people=[];
 }
 query='';
 deleteMode=false;
 deleteSelected=new Set();
 save();
 const dp=document.getElementById('datePicker');if(dp)dp.value=state.date;
 tab='check';
 render();
 toast('기록을 열었습니다. 수정 후 체크하면 저장됩니다.');
}
async function exportExcel(r){
 const rows=[['연번','이름','생년월일','전화번호','주소',r.title+' ('+r.date+')']];
 const people=r.people||state.people;
 people.forEach((p,i)=>{
  const cv=r.checks[p.id];
  const info=parseCheck(cv);
  let value='';
  if(cv===true)value='O';
  else if(typeof cv==='string')value=cv;
  else if(cv && typeof cv==='object')value=info.relation+(info.time?' · '+info.time:'');
  rows.push([i+1,p.name,p.birth||'',p.phone||'',p.address||'',value]);
});
 const ws=XLSX.utils.aoa_to_sheet(rows),wb=XLSX.utils.book_new();
 XLSX.utils.book_append_sheet(wb,ws,'기록');
 const filename=(r.title+'_'+r.date).replace(/[\\/:*?"<>|]/g,'_')+'.xlsx';
 const data=XLSX.write(wb,{bookType:'xlsx',type:'array'});
 const blob=new Blob([data],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 const file=new File([blob],filename,{type:blob.type});

 // 모바일에서는 생성한 Excel 파일을 운영체제 공유창으로 전달
 if(navigator.share && (!navigator.canShare || navigator.canShare({files:[file]}))){
   try{
     await navigator.share({title:filename,text:'복지 체크북 기록',files:[file]});
     return;
   }catch(err){
     if(err && err.name==='AbortError')return;
   }
 }
 // 공유 기능을 지원하지 않는 브라우저는 다운로드로 대체
 const url=URL.createObjectURL(blob);
 const a=document.createElement('a');a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}
function renderManage(){
 const trash=Array.isArray(state.trash)?state.trash:[];
 let trashHtml='';
 if(!trash.length){
   trashHtml='<div class="muted">휴지통이 비어 있습니다.</div>';
 }else{
   trashHtml=trash.slice().reverse().map(r=>{
     const n=Object.values(r.checks||{}).filter(Boolean).length;
     const total=Array.isArray(r.people)?r.people.length:0;
     const deleted=r.deletedAt?new Date(r.deletedAt).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
     return `<div class="record"><b>${esc(r.title)}</b><div class="muted">${esc(r.date)} · ${n}명/${total}명 체크${deleted?' · 삭제 '+esc(deleted):''}</div><div class="actions" style="margin-top:8px"><button class="small" onclick="restoreTrash('${String(r.id).replace(/'/g,"\\'")}')">↩ 복원</button><button class="small danger" onclick="permanentDeleteTrash('${String(r.id).replace(/'/g,"\\'")}')">영구 삭제</button></div></div>`;
   }).join('');
 }
 main.innerHTML=`<div class="card"><b>관리</b><p class="muted">현재 기기의 브라우저에 명단과 기록이 저장됩니다.</p><button class="danger" onclick="resetAll()">전체 데이터 초기화</button></div>
 <div class="card"><b>🗑️ 기록 휴지통</b><p class="muted">삭제한 기록은 휴지통으로 이동하며, 직접 영구 삭제하기 전까지 보관됩니다.</p><div id="trashList">${trashHtml}</div>${trash.length?'<button style="width:100%;margin-top:10px" onclick="emptyTrash()">휴지통 비우기</button>':''}</div>
 <div class="card"><b>사용 순서</b><p class="muted">① 체크 항목 입력 → ② 이름 검색 또는 🎙️ 음성 → ③ 체크 → ④ 필요하면 아래에서 대상자 추가·삭제 → ⑤ 목록에서 Excel 저장</p></div>`;
}
function restoreTrash(id){
 const idx=state.trash.findIndex(x=>String(x.id)===String(id));
 if(idx<0){alert('휴지통에서 기록을 찾을 수 없습니다.');return}
 const r=JSON.parse(JSON.stringify(state.trash[idx]));
 delete r.deletedAt;
 if(state.records.some(x=>String(x.id)===String(r.id))){r.id=crypto.randomUUID()}
 state.records.push(r);
 state.trash.splice(idx,1);
 save();render();toast('기록을 복원했습니다.');
}
function permanentDeleteTrash(id){
 const idx=state.trash.findIndex(x=>String(x.id)===String(id));
 if(idx<0)return;
 if(!confirm('이 기록을 영구적으로 삭제할까요?\n영구 삭제 후에는 복원할 수 없습니다.'))return;
 state.trash.splice(idx,1);
 save();render();toast('기록을 영구 삭제했습니다.');
}
function emptyTrash(){
 if(!state.trash.length)return;
 if(!confirm(`휴지통의 ${state.trash.length}개 기록을 모두 영구 삭제할까요?\n삭제 후에는 복원할 수 없습니다.`))return;
 state.trash=[];save();render();toast('휴지통을 비웠습니다.');
}
function resetAll(){if(confirm('모든 명단과 기록을 삭제할까요?')){localStorage.removeItem(KEY);location.reload()}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',1500)}
render();
</script>
</body></html>
