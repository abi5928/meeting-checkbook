<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#4f7cff">
<link rel="manifest" href="manifest.json">
<title>만남 체크북</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6fb;color:#182235;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff;box-shadow:0 0 30px #00000012}
header{padding:16px 18px 14px;background:#4f7cff;color:white;position:sticky;top:0;z-index:5}
.title{font-size:21px;font-weight:800}.datebar{display:flex;align-items:center;gap:8px;margin-top:10px}
.datebar input{flex:1;border:0;border-radius:10px;padding:9px;background:#fff;color:#182235;font-weight:700}
main{padding:15px 15px 92px}.card{background:#fff;border:1px solid #e4e8f0;border-radius:16px;padding:14px;margin-bottom:12px}
.summary{background:#f5f7ff;border-radius:18px;padding:15px;margin-bottom:12px}.summaryrow{display:flex;justify-content:space-between;align-items:end}
.count{font-size:26px;font-weight:800}.muted{color:#718096;font-size:13px}.progress{height:8px;background:#e5eaf5;border-radius:99px;margin-top:11px;overflow:hidden}.bar{height:100%;background:#4f7cff;border-radius:99px;width:0}
input[type=text],input[type=file],select{width:100%;padding:13px;border:1px solid #dbe2ef;border-radius:13px;font-size:16px;background:#fff}
button{border:0;border-radius:11px;padding:10px 12px;font-weight:750;color:#182235;background:#edf1f7}
.primary{background:#182235;color:#fff}.voice{width:100%;background:#182235;color:#fff;padding:14px;font-size:16px;margin:10px 0}
.iosVoiceGuide{background:#f5f8ff;border:1px solid #dbe7ff;border-radius:13px;padding:12px;line-height:1.6;text-align:center;margin-bottom:8px}.searchrow{display:flex;gap:7px}.searchrow input{flex:1}.mic{font-size:20px;padding:9px 13px;background:#eef5ff;color:#155eef}
.list{margin-top:10px}.person{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:12px 4px;border-bottom:1px solid #edf0f5}.person.delete-mode{grid-template-columns:32px 32px 1fr}.person.delete-mode .name{min-width:0}.person.delete-mode .actions{display:none}
.num{color:#182235;font-size:14px;font-weight:800;text-align:right;min-width:30px;padding-right:2px}.name{font-weight:700}.birth{display:block;color:#8a95a8;font-size:12px;margin-top:3px}
.actions{display:flex;gap:5px;align-items:center;flex-wrap:nowrap;justify-content:flex-end}.actions button,.actions select{flex:none}.actions select{max-width:86px}.status{min-width:62px}.compact{white-space:nowrap;min-width:auto}.memo{background:#f5f7ff;color:#40506b}.memo.has{background:#fff3cd;color:#7a5600}.off{background:#f0f2f6;color:#7a8495}.on{background:#dff7e8;color:#198754}.call{background:#edf8f1;color:#167044;padding:9px}
.warn{background:#fff7e6;color:#946200;padding:10px;border-radius:10px;font-size:13px;margin:8px 0}.ok{background:#edf8f1;color:#167044;padding:10px;border-radius:10px;font-size:13px;margin:8px 0}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(560px,100%);background:#fff;border-top:1px solid #e6eaf1;display:flex;padding:7px 3px calc(7px + env(safe-area-inset-bottom));z-index:6}
nav button{flex:1;background:none;font-size:11px;padding:7px 2px;color:#6d7788}nav button.active{color:#4f7cff;font-weight:800}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:flex-end;z-index:20}.sheet{background:#fff;width:min(560px,100%);margin:auto;border-radius:22px 22px 0 0;padding:20px}.result{padding:13px;border:1px solid #e2e7f0;border-radius:12px;margin:8px 0}.close{width:100%;margin-top:10px}.record{padding:12px 0;border-bottom:1px solid #edf0f5}.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#182235;color:#fff;padding:10px 16px;border-radius:99px;display:none;z-index:30;white-space:nowrap}
.small{font-size:12px;padding:7px 9px}.danger{background:#fff0f0;color:#b42318}.routeItem{display:grid;grid-template-columns:30px 1fr auto;gap:8px;align-items:center;padding:11px 4px;border-bottom:1px solid #edf0f5}.routeNum{font-weight:800;text-align:center;color:#4f7cff}.routeAddr{font-size:13px;color:#5f6b7a;margin-top:3px}.routeActions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.routeSummary{background:#f5f7ff;border-radius:14px;padding:12px;line-height:1.6}.routeMap{height:300px;border-radius:14px;overflow:hidden;margin-top:10px;border:1px solid #e6eaf0;background:#f7f8fb}.routeMap svg{width:100%;height:100%;display:block}.routeMap .routeLine{fill:none;stroke:#4f7cff;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}.routeMap .routeGrid{stroke:#dfe4ed;stroke-width:1}.routeMap .routeLabel{font-size:14px;font-weight:800;fill:#182235}.routeMap .routeNum{font-size:11px;font-weight:800;fill:#fff}.routeMap .routeDot{fill:#fff;stroke:#182235;stroke-width:2}.routeMap .startDot{fill:#182235;stroke:#fff;stroke-width:2}.routeSelect{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid #edf0f5}.routeSelect input{width:22px;height:22px;flex:none}.routeSelectMain{min-width:0;flex:1}.routeSelectName{font-weight:800}.routeSelectAddr{font-size:12px;color:#68758a;margin-top:3px}.routeTop{display:flex;justify-content:space-between;align-items:center;gap:8px}.routeStartBox{background:#f7f9fd;border:1px solid #e5e9f1;border-radius:13px;padding:11px}.routeHint{background:#fff7e6;color:#7a5600;padding:10px;border-radius:12px;font-size:12px;line-height:1.55}
</style>
</head>
<body>
<div class="app">
<header>
 <div class="title">📋 만남 체크북</div>
 <div class="datebar"><input id="datePicker" type="date"><span>날짜</span></div>
</header>
<main id="main"></main>
<nav>
 <button id="navNew" onclick="newTopic()">🆕<br>NEW</button>
 <button id="navCheck" onclick="tab='check';render()">📋<br>체크</button>
 <button id="navRecords" onclick="tab='records';render()">🗂<br>기록</button>
 <button id="navManage" onclick="tab='manage';render()">⚙<br>관리</button>
 <button id="navRoute" onclick="tab='route';render()">🚗<br>동선</button>
</nav>
</div>
<div class="modal" id="voiceModal"><div class="sheet">
 <h2>🎤 음성 체크</h2><div id="voiceMsg">이름을 말씀하세요.</div><div id="voiceResults"></div>
 <button class="close" onclick="closeVoice()">닫기</button>
</div></div>
<div class="modal" id="addModal"><div class="sheet">
 <h2>＋ 대상자 추가</h2>
 <input id="addName" type="text" placeholder="이름">
 <input id="addBirth" type="text" placeholder="생년월일 (예: 1950-05-08)" style="margin-top:8px">
 <input id="addPhone" type="text" placeholder="전화번호" style="margin-top:8px">
 <input id="addAddress" type="text" placeholder="주소" style="margin-top:8px">
 <button class="primary" style="width:100%;margin-top:10px" onclick="addPerson()">명단에 추가</button>
 <button class="close" onclick="closeAdd()">취소</button>
</div></div>
<div class="modal" id="memoModal"><div class="sheet">
 <h2>📝 메모</h2><div id="memoPerson" class="muted" style="margin-bottom:8px"></div>
 <textarea id="memoText" rows="4" style="width:100%;padding:12px;border:1px solid #dbe2ef;border-radius:13px;font-size:16px;resize:vertical" placeholder="간단한 메모를 입력하세요."></textarea>
 <button class="primary" style="width:100%;margin-top:10px" onclick="saveMemo()">저장</button>
 <button class="close" onclick="closeMemo()">취소</button>
</div></div>
<div class="modal" id="specialModal"><div class="sheet">
 <h2>체크 정보</h2><div id="specialPerson" class="muted" style="margin-bottom:8px"></div>
 <select id="specialRelation"><option value="">체크하지 않음</option><option value="본인">본인</option><option value="가족">가족</option><option value="기타">기타</option></select>
 <div style="display:flex;gap:8px;margin-top:8px"><select id="specialHour"><option value="">시</option></select><select id="specialMinute"><option value="">분</option></select></div>
 <button class="primary" style="width:100%;margin-top:10px" onclick="saveSpecialModal()">저장</button>
 <button class="close" onclick="closeSpecialModal()">취소</button>
</div></div>
<div class="modal" id="newModal"><div class="sheet">
 <h2>🆕 새로운 체크북</h2>
 <p class="muted">업무 주제를 선택하면 주제에 맞는 체크 방식으로 시작합니다.</p>
 <label class="muted" style="display:block;margin-bottom:6px">구분</label>
 <select id="newTopicType" onchange="updateNewTopicUI()"><option value="방문상담">방문상담</option><option value="물품수령">물품수령</option><option value="출석체크">출석체크</option><option value="안부확인">안부확인</option><option value="기타">기타</option></select>
 <label class="muted" style="display:block;margin:10px 0 6px">제목</label>
 <input id="newTitle" type="text" placeholder="이번 업무의 제목을 입력하세요 (선택)">
 <input id="newFile" type="file" accept=".xlsm,.xlsx,.xls" style="margin-top:8px">
 <button class="primary" style="width:100%;margin-top:8px" onclick="createNewTopic()">새 체크북 시작</button>
 <button class="close" onclick="closeNew()">취소</button>
</div></div>
<div class="toast" id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const KEY='welfare_checkbook_from_attendance_v1';
let state=JSON.parse(localStorage.getItem(KEY)||'null')||{
 people:[
  {id:'1',name:'김창억',birth:'1949-05-01',phone:'',address:''},{id:'2',name:'박수직',birth:'1951-04-11',phone:'',address:''},
  {id:'3',name:'조강하',birth:'1956-05-01',phone:'',address:''},{id:'4',name:'구조대',birth:'1948-07-05',phone:'',address:''},
  {id:'5',name:'구조대',birth:'1950-05-08',phone:'',address:''},{id:'6',name:'한사방',birth:'1952-02-17',phone:'',address:''},
  {id:'7',name:'고용대',birth:'1955-10-03',phone:'',address:''},{id:'8',name:'최수몽',birth:'1958-12-22',phone:'',address:''}
 ],records:[],trash:[],title:'출석체크',topicType:'출석체크',date:new Date().toISOString().slice(0,10)
};
if(!Array.isArray(state.trash)) state.trash=[];
let tab='check',query='',deleteMode=false,deleteSelected=new Set(),activeRecordId=null,memoPersonId=null,specialPersonId=null;
const ROUTE_KEY='meeting_checkbook_route_v1';
let routeState=JSON.parse(localStorage.getItem(ROUTE_KEY)||'null')||{stops:[],start:'',optimized:[],routeDistance:0,routeDuration:0,routeGeometry:null,routeApproximate:false};
routeState.stops=Array.isArray(routeState.stops)?routeState.stops:[];routeState.optimized=Array.isArray(routeState.optimized)?routeState.optimized:[];routeState.selectedIds=Array.isArray(routeState.selectedIds)?routeState.selectedIds:routeState.stops.map(x=>x.id);routeState.startMode=['auto','current','stop'].includes(routeState.startMode)?routeState.startMode:(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)?'current':'auto');routeState.startStopId=routeState.startStopId||routeState.start||'';routeState.routeStartMeta=routeState.routeStartMeta||null;
function saveRoute(){localStorage.setItem(ROUTE_KEY,JSON.stringify(routeState))}

function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function nameNorm(s){return String(s||'').replace(/\s+/g,'').toLowerCase()}
function phoneNorm(s){return String(s||'').replace(/[^\d+]/g,'')}
function birthNorm(v){
 if(v===null||v===undefined||v==='')return '';
 if(v instanceof Date&&!isNaN(v))return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
 let s=String(v).trim().replace(/\s/g,'');
 let m=s.match(/^(\d{4})[-./](\d{1,2})[-./](\d{1,2})$/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
 if(/^\d{8}$/.test(s))return s.slice(0,4)+'-'+s.slice(4,6)+'-'+s.slice(6,8);
 if(/^\d{6}$/.test(s)){let yy=+s.slice(0,2);return (yy<=25?2000+yy:1900+yy)+'-'+s.slice(2,4)+'-'+s.slice(4,6)}
 let n=Number(s);if(isFinite(n)&&n>20000&&n<70000){let d=new Date(Date.UTC(1899,11,30)+n*86400000);return d.getUTCFullYear()+'-'+String(d.getUTCMonth()+1).padStart(2,'0')+'-'+String(d.getUTCDate()).padStart(2,'0')}
 return s
}
function birth6(b){let m=String(b||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);return m?m[1].slice(2)+m[2]+m[3]:b||''}
function getRecord(create=true){
 let r=activeRecordId ? state.records.find(x=>x.id===activeRecordId) : state.records.find(x=>x.date===state.date&&x.title===state.title);
 if(!r&&create){
  r={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:state.people.map(p=>({...p}))};
  state.records.push(r);activeRecordId=r.id;
 }
 if(r){
  state.date=r.date||state.date;
  state.title=r.title||state.title||'기타';
  state.topicType=r.topicType||inferTopicType(state.title);
  // 기록에 명단이 있으면 반드시 그 명단을 현재 화면으로 복원한다.
  // 구버전 기록에 명단이 없으면 현재 명단을 기록에 스냅샷으로 저장한다.
  if(Array.isArray(r.people) && r.people.length){
    state.people=r.people.map(p=>({...p}));
  }else if(state.people.length){
    r.people=state.people.map(p=>({...p}));
  }
 }
 return r
}
function checkedSet(){let r=getRecord(false);return new Map(r?Object.keys(r.checks).filter(k=>r.checks[k]).map(k=>[k,r.checks[k]]):[])}
function specialTopic(){return ['방문상담','물품수령','안부확인'].includes(state.topicType)}
function parseCheck(v){
 if(v && typeof v==='object') return {relation:v.relation||'',time:v.time||'',memo:v.memo||'',checked:v.checked!==false};
 if(typeof v==='string' && ['본인','가족','기타'].includes(v)) return {relation:v,time:'',memo:'',checked:true};
 if(v===true) return {relation:'',time:'',memo:'',checked:true};
 return {relation:'',time:'',memo:'',checked:false};
}
function setSpecialCheck(id,relation,hour,minute){
 let r=getRecord();
 const time=(hour&&minute)?hour+':'+minute:'';
 const old=parseCheck(r.checks[id]);
 if(!relation){delete r.checks[id];}
 else{r.checks[id]={relation,time,memo:old.memo||'',checked:true};}
 r.people=state.people.map(p=>({...p}));
 save();render();toast(relation?relation+(time?' · '+time:'')+'로 체크되었습니다.':'체크가 취소되었습니다.');
}
function updateSpecialTime(id){
 const r=getRecord();
 const info=parseCheck(r?.checks?.[id]);
 if(!info.relation)return;
 const h=document.getElementById('tmh_'+String(id)),m=document.getElementById('tmm_'+String(id));
 const time=h?.value&&m?.value?h.value+':'+m.value:'';
 r.checks[id]={relation:info.relation,time,memo:info.memo||'',checked:true};
 r.people=state.people.map(p=>({...p}));
 save();
 toast(time?'만난 시간이 저장되었습니다.':'만난 시간이 해제되었습니다.');
}
function setVisitType(id,value){setSpecialCheck(id,value,'')}
function toggle(id){
 let r=getRecord(),s=checkedSet();
 r.people=state.people.map(p=>({...p}));
 if(s.has(String(id))){delete r.checks[id];toast('체크가 취소되었습니다.')}
 else{r.checks[id]={checked:true,memo:''};toast('✓ 체크되었습니다.')}
 query='';
 save();
 render();
}
function setNav(){['Check','Records','Manage','Route'].forEach(x=>document.getElementById('nav'+x).classList.toggle('active',tab===x.toLowerCase()));document.getElementById('navNew').classList.remove('active')}
function inferTopicType(title){const t=String(title||'');if(['방문상담','물품수령','출석체크','안부확인'].includes(t))return t;if(t==='출석')return '출석체크';return '기타'}
function updateNewTopicUI(){const type=document.getElementById('newTopicType')?.value||'기타';const input=document.getElementById('newTitle');if(!input)return;input.placeholder=type==='기타'?'제목을 입력하세요 (선택)':'예: '+type+' 관련 업무 제목 (선택)'}
function newTopic(){
 activeRecordId=null;
 document.getElementById('newTopicType').value='방문상담';
 document.getElementById('newTitle').value='';
 document.getElementById('newFile').value='';
 updateNewTopicUI();
 document.getElementById('newModal').style.display='flex';
 document.getElementById('newTitle').focus();
}
function closeNew(){document.getElementById('newModal').style.display='none'}
function createNewTopic(){
 const topicType=document.getElementById('newTopicType').value;
 const customTitle=document.getElementById('newTitle').value.trim();
 const title=customTitle||topicType;
 const f=document.getElementById('newFile').files[0];
 if(!title){alert('구분 또는 제목을 확인하세요.');return}
 if(!f){
   state.people=[];
   state.title=title;
   state.topicType=topicType;
   state.date=new Date().toISOString().slice(0,10);
   query='';
   deleteMode=false;
   deleteSelected=new Set();
   const nr={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:[]};
   state.records.push(nr);
   activeRecordId=nr.id;
   save();
   closeNew();
   tab='check';
   document.getElementById('datePicker').value=state.date;
   render();
   toast('새 체크북이 시작되었습니다 · 화면에서 명단을 추가하세요');
   return;
 }
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   let h=rows.findIndex(row=>row.some(v=>['이름','성명','대상자명','대상자'].includes(String(v).trim())));
   if(h<0)h=5;
   const heads=rows[h].map(v=>String(v).trim());
   let ni=heads.findIndex(v=>['이름','성명','대상자명','대상자'].includes(v));if(ni<0)ni=1;
   let bi=heads.findIndex(v=>v.includes('생년'));if(bi<0)bi=2;
   let pi=heads.findIndex(v=>v.includes('전화')||v.includes('휴대'));if(pi<0)pi=3;
   const people=[];
   rows.slice(h+1).forEach(row=>{
    const name=String(row[ni]??'').trim();if(!name)return;
    let ai=heads.findIndex(v=>v.includes('주소')||v.includes('거주지')||v.includes('도로명')); if(ai<0)ai=4;
    people.push({id:crypto.randomUUID(),name,birth:birthNorm(row[bi]),phone:String(row[pi]??'').trim(),address:String(row[ai]??'').trim()});
   });
   if(!people.length){alert('Excel에서 대상자 명단을 찾지 못했습니다.');return}
   state.people=people;
   state.title=title;
   state.topicType=topicType;
   state.date=new Date().toISOString().slice(0,10);
   query='';
   const nr={id:crypto.randomUUID(),date:state.date,title:state.title,topicType:state.topicType||'기타',checks:{},people:people.map(p=>({...p}))};
   state.records.push(nr);
   activeRecordId=nr.id;
   save();
   closeNew();
   tab='check';
   document.getElementById('datePicker').value=state.date;
   render();
   toast('새 체크북이 시작되었습니다 · '+people.length+'명');
  }catch(err){alert('Excel 읽기 오류: '+err.message)}
 };
 reader.readAsArrayBuffer(f);
}
function render(){setNav();if(tab==='check')renderCheck();else if(tab==='records')renderRecords();else if(tab==='manage')renderManage();else if(tab==='route')renderRoute()}
document.getElementById('datePicker').value=state.date;document.getElementById('datePicker').onchange=e=>{state.date=e.target.value;if(activeRecordId){const r=state.records.find(x=>x.id===activeRecordId);if(r)r.date=state.date;}save();render()};

function renderCheck(){
 query='';
 const r=getRecord(false),s=checkedSet(),list=state.people.filter(p=>!query||nameNorm(p.name).includes(nameNorm(query))||birth6(p.birth).includes(query.replace(/-/g,'')));
 const pct=state.people.length?Math.round(s.size/state.people.length*100):0;
 main.innerHTML=`<section class="summary"><div class="summaryrow"><div><div class="muted">${esc(state.title)} · ${esc(state.date)}</div><div class="count">${s.size} / ${state.people.length}명</div></div><div class="muted">${pct}%</div></div><div class="progress"><div class="bar" style="width:${pct}%"></div></div></section>

function drawSearch(){
 const box=document.getElementById('searchList');if(!box)return;
 const list=state.people.filter(p=>!query||nameNorm(p.name).includes(nameNorm(query))||birth6(p.birth).includes(query.replace(/-/g,'')));
 if(!state.people.length){box.innerHTML='<div class="warn">명단이 없습니다. 아래의 추가 또는 Excel 명단 불러오기를 이용하세요.</div>';return}
 if(!list.length){box.innerHTML='<div class="warn">검색 결과가 없습니다.</div>';return}
 const s=checkedSet();
 box.innerHTML=list.map((p)=>{
   const idx=list.indexOf(p)+1;
   const num=`<div class="num">${idx}.</div>`;
   const del=deleteMode?`<input type="checkbox" ${deleteSelected.has(String(p.id))?'checked':''} onchange="setDelete('${String(p.id).replace(/'/g,"\\'")}',this.checked)" style="width:22px;height:22px">`:'';
   const key=String(p.id).replace(/'/g,"\\'");
   let control='';
   if(!deleteMode){
     const info=parseCheck(s.get(String(p.id)));
     const hasCheck=s.has(String(p.id));
     if(specialTopic()){
       const label=info.relation ? esc(info.relation)+(info.time?' · '+esc(info.time):'') : '체크';
       control=`<button class="status compact ${hasCheck?'on':'off'}" onclick="openSpecialModal('${key}')">${hasCheck?'✓ ':''}${label}</button>`;
     }else{
       control=`<button class="status ${hasCheck?'on':'off'}" onclick="toggle('${key}')">${hasCheck?'✓ 체크':'체크'}</button>`;
     }
     const memoBtn=`<button class="small memo ${info.memo?'has':''}" onclick="openMemo('${key}')">${info.memo?'📝 메모✓':'메모'}</button>`;
     control += memoBtn;
   }
   return `<div class="person ${deleteMode?'delete-mode':''}">${num}${del}<div class="name">${esc(p.name)}<span class="birth">${esc(birth6(p.birth))}${p.phone?' · '+esc(p.phone):''}${p.address?' · '+esc(p.address):''}</span></div><div class="actions">${deleteMode?'':(p.phone?`<button class="call" onclick="callPerson('${esc(phoneNorm(p.phone))}')">📞</button>`:'')}${control}</div></div>`;
 }).join('')
}

function deleteSelectedPeople(){
 if(!deleteSelected.size){alert('삭제할 사람을 선택하세요.');return}

 // 현재 명단에서 실제 삭제
 state.people=state.people.filter(p=>!ids.has(String(p.id)));
 // 현재 편집 중인 기록에서도 삭제한 사람 제거
 const current=activeRecordId
   ? state.records.find(x=>x.id===activeRecordId)
   : state.records.find(x=>x.date===state.date && x.title===state.title);
 if(current){
   current.people=state.people.map(p=>({...p}));
   current.checks=current.checks||{};
   ids.forEach(id=>delete current.checks[id]);

let activeVoiceRec=null, voiceListening=false, voiceRestartCount=0, voiceGotResult=false, voiceFallbackTimer=null;
function isIOSDevice(){
 return /iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
}
function getSpeechRecognitionCtor(){
 const isIOS=isIOSDevice();
 // PC/Android에서는 기존 웹 음성인식을 유지합니다. iPhone은 시스템 받아쓰기 입력을 사용합니다.
 if(isIOS) return null;
 return window.SpeechRecognition||window.webkitSpeechRecognition||null;
}
function voiceInput(){
 const isIOS=isIOSDevice();
 document.getElementById('voiceModal').style.display='flex';
 const msg=document.getElementById('voiceMsg'),res=document.getElementById('voiceResults');
 res.innerHTML=''; voiceListening=true; voiceRestartCount=0; voiceGotResult=false; activeVoiceRec=null;

 // iPhone/iPad Safari 및 홈 화면 앱에서는 Web Speech API를 호출하지 않습니다.
 // 앱의 🎙️ 버튼으로 이름 입력창을 열고, iOS 키보드의 받아쓰기 🎤을 사용하도록 합니다.
 if(isIOS){
   showIOSVoiceFallback(msg,res);
   return;
 }
 const SR=getSpeechRecognitionCtor();
 if(!SR){
   msg.textContent='이 브라우저에서는 웹앱 음성인식을 사용할 수 없습니다.';
   res.innerHTML=voiceFallbackHtml();
   focusVoiceFallback();
   voiceListening=false; return;
 }
 startVoiceRecognition(SR,msg,res);
}
function showIOSVoiceFallback(msg,res){
 msg.textContent='🎙️ 이름을 말해 주세요.';
 res.innerHTML='<div class="iosVoiceGuide"><b>이름 입력창을 눌러 키보드가 나타나면</b><br>키보드의 🎤을 눌러 이름을 말씀하세요.<br><span class="muted">입력된 이름은 자동으로 대상자를 찾습니다.</span></div>'+voiceFallbackHtml(true);
 voiceListening=false;
 setTimeout(focusVoiceFallback,120);
}
function focusVoiceFallback(){
 const input=document.getElementById('voiceFallback');
 if(!input)return;
 if(!input.dataset.voiceBound){setupVoiceFallbackAutoCheck();input.dataset.voiceBound='1'}
 try{input.focus();input.click();input.setSelectionRange(input.value.length,input.value.length)}catch(_){input.focus()}
}
function setupVoiceFallbackAutoCheck(){
 const input=document.getElementById('voiceFallback');
 if(!input)return;
 const check=()=>{
   clearTimeout(voiceFallbackTimer);
   const value=input.value.trim();
   if(!value)return;
   voiceFallbackTimer=setTimeout(()=>{
     if(document.getElementById('voiceFallback')?.value.trim()===value) submitVoiceFallback();
   },650);
 };
 input.addEventListener('input',check);
 input.addEventListener('change',check);
 input.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();submitVoiceFallback()}});
}
function startVoiceRecognition(SR,msg,res){
 if(!voiceListening)return;
 try{activeVoiceRec?.abort()}catch(_){ }
 const rec=new SR(); activeVoiceRec=rec;
 const isIOS=isIOSDevice();
 rec.lang='ko-KR';
 rec.interimResults=true;
 rec.continuous=!isIOS;
 rec.maxAlternatives=3;
 let gotFinal=false, endedNormally=false;
 rec.onstart=()=>{msg.textContent='🎙️ 듣고 있습니다. 이름을 말씀하세요.';res.innerHTML='<div class="muted">지금 이름을 말씀하세요. 인식이 끝나면 자동으로 검색합니다.</div>';};
 rec.onaudiostart=()=>{msg.textContent='🎙️ 듣고 있습니다. 이름을 말씀하세요.';};
 rec.onsoundstart=()=>{msg.textContent='🎙️ 듣고 있습니다… 이름을 말씀하세요.';};
 rec.onresult=e=>{
   let interim='', finalText='';
   for(let i=e.resultIndex;i<e.results.length;i++){
     const t=e.results[i][0].transcript.trim();
     if(e.results[i].isFinal) finalText+=t+' '; else interim+=t+' ';
   }
   if(interim.trim()) msg.textContent='🎙️ 듣는 중: '+interim.trim();
   if(finalText.trim()){
     gotFinal=true; voiceGotResult=true; voiceListening=false; endedNormally=true;
     handleVoiceText(finalText.trim());
     try{rec.stop()}catch(_){ }
   }
 };
 rec.onerror=e=>{
   const code=e.error||'unknown';
   if(code==='not-allowed'||code==='service-not-allowed'){
     voiceListening=false;
     msg.textContent='음성인식을 사용할 수 없습니다.';
     res.innerHTML='<div class="warn">브라우저의 음성인식 서비스를 사용할 수 없습니다.<br>아래 입력창에서 <b>키보드 🎤</b>을 사용해 이름을 말할 수 있습니다.</div>'+voiceFallbackHtml(true);
     setTimeout(focusVoiceFallback,120);
   }else if(code==='no-speech'||code==='aborted'){
     voiceListening=false;
     msg.textContent='음성을 듣지 못했습니다.';
     res.innerHTML='<div class="warn">오류 코드: <b>'+esc(code)+'</b><br>다시 시도하거나 아래 키보드 🎤을 사용해 주세요.</div>'+voiceFallbackHtml(true);
     setTimeout(focusVoiceFallback,120);
   }else{
     voiceListening=false;
     msg.textContent='음성인식 오류: '+code;
     res.innerHTML='<div class="warn">오류 코드: <b>'+esc(code)+'</b></div>'+voiceFallbackHtml(true);
     setTimeout(focusVoiceFallback,120);
   }
 };
 rec.onend=()=>{
   activeVoiceRec=null;
   if(gotFinal||endedNormally||!voiceListening)return;
   if(isIOS){
     voiceListening=false;
     msg.textContent='음성인식이 종료되었습니다.';
     res.innerHTML='<div class="warn">음성 입력이 끝났습니다.</div>'+voiceFallbackHtml(true);
     setTimeout(focusVoiceFallback,120);
   }
 };
 try{msg.textContent='🎙️ 마이크를 준비하고 있습니다...';rec.start()}
 catch(err){
   voiceListening=false; msg.textContent='음성인식을 시작하지 못했습니다.';
   res.innerHTML='<div class="warn">시작 오류: <b>'+esc(err?.name||'unknown')+'</b></div>'+voiceFallbackHtml(true);
   setTimeout(focusVoiceFallback,120);
 }
}
function retryVoice(){
 try{activeVoiceRec?.abort()}catch(_){ }
 voiceListening=true; voiceRestartCount=0; voiceGotResult=false;
 const msg=document.getElementById('voiceMsg'),res=document.getElementById('voiceResults');
 if(isIOSDevice()){showIOSVoiceFallback(msg,res);return;}
 const SR=getSpeechRecognitionCtor();
 if(SR)startVoiceRecognition(SR,msg,res);
 else{voiceListening=false;msg.textContent='음성인식을 사용할 수 없습니다.';res.innerHTML=voiceFallbackHtml();setTimeout(focusVoiceFallback,120)}
}
function voiceFallbackHtml(isIOS=false){
 return '<div style="margin-top:8px"><input id="voiceFallback" type="text" inputmode="text" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="이름을 입력하거나 키보드 🎤으로 말하세요" style="width:100%;padding:14px;border:1px solid #dbe2ef;border-radius:13px;font-size:17px;box-sizing:border-box"><button class="primary" style="width:100%;margin-top:8px" onclick="submitVoiceFallback()">이 이름으로 찾기</button></div>'+ (isIOS?'<div class="muted" style="margin-top:8px;text-align:center">앱의 🎙️ 버튼은 이 입력창을 바로 열어 줍니다.</div>':'');
}
function submitVoiceFallback(){
 const input=document.getElementById('voiceFallback');
 const value=input?.value.trim();
 if(!value)return;
 clearTimeout(voiceFallbackTimer);
 handleVoiceText(value);
}
function handleVoiceText(spoken){
  const msg=document.getElementById('voiceMsg'),res=document.getElementById('voiceResults');
  query=spoken;const search=document.getElementById('search');if(search)search.value=spoken;
  const exact=state.people.filter(p=>nameNorm(p.name)===nameNorm(spoken));
  const matches=exact.length?exact:state.people.filter(p=>nameNorm(spoken).includes(nameNorm(p.name))||nameNorm(p.name).includes(nameNorm(spoken)));
  msg.textContent='인식: '+spoken;
  if(matches.length===1){toggle(matches[0].id);res.innerHTML=`<div class="ok">✓ ${esc(matches[0].name)} · ${esc(birth6(matches[0].birth))} 체크 완료</div>`;}
  else if(matches.length){res.innerHTML='<div class="warn">동명이인 또는 유사한 이름입니다. 생년월일을 확인하세요.</div>'+matches.map(p=>`<div class="result" onclick="toggle('${String(p.id).replace(/'/g,"\\'")}');closeVoice()"><b>${esc(p.name)}</b><br><span class="muted">${esc(birth6(p.birth))}${p.phone?' · '+esc(p.phone):''}${p.address?' · '+esc(p.address):''}</span></div>`).join('')}
  else res.innerHTML='<div class="warn">일치하는 대상자가 없습니다. 검색 결과를 확인하세요.</div>';
  drawSearch()
}
function closeVoice(){voiceListening=false;try{activeVoiceRec?.abort()}catch(_){ }activeVoiceRec=null;document.getElementById('voiceModal').style.display='none';render()}

function importExcel(){
 const f=document.getElementById('excelFile').files[0];if(!f){alert('Excel 파일을 선택하세요.');return}
 const reader=new FileReader();
 reader.onload=e=>{
  try{
   const wb=XLSX.read(e.target.result,{type:'array',cellDates:true});
   const ws=wb.Sheets[wb.SheetNames[0]];
   const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true});
   let h=rows.findIndex(row=>row.some(v=>['이름','성명','대상자명','대상자'].includes(String(v).trim())));if(h<0)h=5;
   const heads=rows[h].map(v=>String(v).trim());
   let ni=heads.findIndex(v=>['이름','성명','대상자명','대상자'].includes(v));if(ni<0)ni=1;
   let bi=heads.findIndex(v=>v.includes('생년'));if(bi<0)bi=2;
   let pi=heads.findIndex(v=>v.includes('전화')||v.includes('휴대'));if(pi<0)pi=3;
   let ai=heads.findIndex(v=>v.includes('주소')||v.includes('거주지')||v.includes('도로명'));if(ai<0)ai=4;
   const people=[];rows.slice(h+1).forEach(row=>{const name=String(row[ni]??'').trim();if(!name)return;people.push({id:crypto.randomUUID(),name,birth:birthNorm(row[bi]),phone:String(row[pi]??'').trim(),address:String(row[ai]??'').trim()})});
   if(!people.length){alert('이름 열을 찾지 못했거나 명단이 없습니다.');return}
   state.people=people;
   const r=activeRecordId?state.records.find(x=>x.id===activeRecordId):null;
   if(r) r.people=people.map(p=>({...p}));
   save();query='';deleteMode=false;deleteSelected=new Set();tab='check';render();toast(people.length+'명 명단을 불러왔습니다.')
  }catch(err){alert('Excel 읽기 오류: '+err.message)}
 };reader.readAsArrayBuffer(f)
}

function renderRecords(){
 main.innerHTML='<div class="card"><b>기록</b><p class="muted">날짜와 체크 항목별로 저장됩니다. 기록을 삭제해도 명단은 삭제되지 않습니다.</p><div id="records"></div></div>';
 const box=document.getElementById('records');
 if(!state.records.length){box.innerHTML+='<div class="muted">저장된 기록이 없습니다.</div>';return}
 state.records.slice().reverse().forEach(r=>{
  const n=Object.values(r.checks||{}).filter(Boolean).length;
  const total=Array.isArray(r.people)&&r.people.length ? r.people.length : state.people.length;
  const d=document.createElement('div');d.className='record';
  d.innerHTML=`<b>${esc(r.title)}</b><div class="muted">구분: ${esc(r.topicType||inferTopicType(r.title))} · ${esc(r.date)} · ${n}명/${total}명 체크</div><div class="actions" style="margin-top:8px"><button class="small">열기</button><button class="small">📥 Excel</button><button class="small danger">🗑 삭제</button></div>`;
  const b=d.querySelectorAll('button');
  b[0].onclick=()=>openRecord(r);

async function geocodeRouteAddress(address){

 const res=await fetch(url,{headers:{'Accept':'application/json'}});

}
function distKm(a,b){const R=6371,rad=Math.PI/180;const dLat=(b.lat-a.lat)*rad,dLon=(b.lon-a.lon)*rad;const x=Math.sin(dLat/2)**2+Math.cos(a.lat*rad)*Math.cos(b.lat*rad)*Math.sin(dLon/2)**2;return 2*R*Math.asin(Math.sqrt(x));}
async function osrmTable(points){
 const res=await fetch('/api/osrm',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({service:'table',points})});
 const data=await res.json().catch(()=>({}));
 if(!res.ok)throw new Error((data.message||data.code||'도로 거리표 계산 서비스 오류')+' ('+res.status+')');
 if(data.code!=='Ok'||!Array.isArray(data.distances)||!Array.isArray(data.durations))throw new Error(data.message||'도로 거리표를 계산할 수 없습니다.');
 return data;
}
function permute(arr){
 const out=[]; const a=arr.slice();
 function rec(i){ if(i===a.length){out.push(a.slice());return} for(let j=i;j<a.length;j++){[a[i],a[j]]=[a[j],a[i]];rec(i+1);[a[i],a[j]]=[a[j],a[i]]} }
 rec(0); return out;
}
async function findBestVisitOrder(startPoint, targets){
 if(!targets.length)return {ordered:[],distance:0,duration:0,approximate:false};
 if(targets.length>7)throw new Error('현재 버전은 한 번에 최대 7개 방문지까지 최적 순서를 계산합니다.');
 const all=[startPoint,...targets];
 try{
  const table=await osrmTable(all);
  const orders=permute(targets);
  let best=null;
  const idx=new Map(all.map((p,i)=>[String(p.id),i]));
  for(const order of orders){
   const seq=[startPoint,...order]; let d=0,t=0,ok=true;
   for(let i=0;i<seq.length-1;i++){
    const a=idx.get(String(seq[i].id)),b=idx.get(String(seq[i+1].id));
    const dv=Number(table.distances?.[a]?.[b]),tv=Number(table.durations?.[a]?.[b]);
    if(!Number.isFinite(dv)||!Number.isFinite(tv)){ok=false;break}
    d+=dv;t+=tv;
   }
   if(ok&&(!best||d<best.distance))best={ordered:order.slice(),distance:d,duration:t,approximate:false};
  }
  if(best)return best;
 }catch(e){
  console.warn('[만남 체크북] 실제 도로거리 계산 실패, 직선거리 기준으로 전환:',e);
 }
 // 공공 도로경로 서비스가 응답하지 않는 경우에도 동선 기능을 사용할 수 있도록
 // 직선거리 기준으로 방문 순서를 계산하고, 최종 실제 이동은 네이버지도에서 다시 계산합니다.
 const remaining=targets.slice(); let cur=startPoint; const ordered=[]; let distance=0;
 while(remaining.length){
  let bi=0,bd=Infinity;
  for(let i=0;i<remaining.length;i++){const d=distKm(cur,remaining[i]);if(d<bd){bd=d;bi=i}}
  const next=remaining.splice(bi,1)[0]; ordered.push(next); distance+=bd; cur=next;
 }
 return {ordered,distance:distance*1000,duration:(distance/30)*60*60,approximate:true};
}
async function fetchOsrmRoute(ordered){

}
function buildApproxRoute(startPoint,ordered){
 const pts=[startPoint,...ordered];
 return {distance:pts.slice(0,-1).reduce((sum,p,i)=>sum+distKm(p,pts[i+1])*1000,0),duration:pts.slice(0,-1).reduce((sum,p,i)=>sum+distKm(p,pts[i+1])/30*3600,0),geometry:{type:'LineString',coordinates:pts.map(p=>[Number(p.lon),Number(p.lat)])}};
}

function naverAppRouteUrl(from,to,waypoints=[]){

 add('dname',to.name||to.address||'도착지');
 waypoints.filter(valid).slice(0,5).forEach((w,i)=>{
  const n=i+1;
  add('v'+n+'lat',Number(w.lat).toFixed(7));

 });

function openNaverUrl(appUrl,webUrl){
 if(!appUrl){window.open(webUrl||'https://map.naver.com/','_blank');return;}
 const isAndroid=/Android/i.test(navigator.userAgent);
 const isIOS=/iPhone|iPad|iPod/i.test(navigator.userAgent);
 // 모바일 웹에서는 공식 URL Scheme 호출 방식을 사용합니다.
 // Android는 공식 문서의 Intent Scheme, iOS는 nmap:// 직접 호출입니다.
 if(isAndroid){
  const intent=appUrl.replace(/^nmap:\/\//,'intent://')+'#Intent;scheme=nmap;action=android.intent.action.VIEW;category=android.intent.category.BROWSABLE;package=com.nhn.android.nmap;end';
  const a=document.createElement('a');

  // nmap://의 쿼리 파라미터를 보존한 채 네이버지도로 전달하는 데 안정적입니다.
  let hidden=false;
  const onHide=()=>{hidden=true;document.removeEventListener('visibilitychange',onHide)};
  document.addEventListener('visibilitychange',onHide);
  const a=document.createElement('a');
  a.href=appUrl;
  a.rel='noopener';
  a.style.display='none';
  document.body.appendChild(a);
  a.click();
  setTimeout(()=>{
   document.removeEventListener('visibilitychange',onHide);
   a.remove();
   if(!hidden&&webUrl)window.location.href=webUrl;
  },1800);
  return;
 }
 window.open(webUrl||appUrl,'_blank','noopener');
}

function openNaverFullRoute(){
 const ids=Array.isArray(routeState.optimized)?routeState.optimized:[];
 const ordered=ids.map(id=>routeState.stops.find(x=>String(x.id)===String(id))).filter(x=>x&&Number.isFinite(Number(x.lat))&&Number.isFinite(Number(x.lon)));
 if(!ordered.length){alert('방문지가 없습니다. 먼저 방문 동선을 최적화해 주세요.');return}
 let from=routeState.routeStartMeta||null;
 if(from&&from.type==='stop'){
  const startStop=ordered.find(x=>String(x.id)===String(from.stopId));
  if(startStop)from=startStop;
 }
 // 자동 출발지인 경우에는 최적화된 첫 방문지를 출발지로 삼지 않고,
 // 저장된 출발점이 없으면 첫 방문지부터 다음 방문지로 연결합니다.
 if(!from||!Number.isFinite(Number(from.lat))||!Number.isFinite(Number(from.lon))){
  if(ordered.length===1){openNavigationToStop(ordered[0]);return}
  from=ordered[0];
 }
 const remaining=ordered.filter(x=>String(x.id)!==String(from.id));
 if(remaining.length===0){openNavigationToStop(ordered[0]);return}
 const to=remaining[remaining.length-1];
 const middle=remaining.slice(0,-1);
 if(middle.length>5){alert('네이버지도 앱은 한 번에 최대 5개의 경유지를 전달할 수 있습니다.\n\n현재 선택된 방문지는 '+ordered.length+'곳입니다.');return}
 // 현재 위치 출발은 네이버 지도 앱이 단말의 현재 위치를 사용하도록
 // 출발지 좌표를 아예 전달하지 않습니다. (네이버 공식 URL Scheme 규격)
 const appFrom = (routeState.routeStartMeta && routeState.routeStartMeta.type==='current') ? null : from;
 const appUrl=naverAppRouteUrl(appFrom,to,middle);
 const webUrl=naverWebRouteUrl(from,to,middle);
 console.log('[만남체크북] NAVER route:',appUrl);
 openNaverUrl(appUrl,webUrl);
}
function naverWebRouteUrl(from,to,waypoints=[]){
 // PC 웹은 네이버 앱 URL Scheme의 경유지 파라미터를 그대로 받을 수 없으므로, 출발→도착의 웹 길찾기만 보조 제공합니다.
 const f=from&&Number.isFinite(Number(from.lat))?Number(from.lon).toFixed(7)+','+Number(from.lat).toFixed(7)+','+encodeURIComponent(from.name||from.address||'출발지'):'';
 const t=to&&Number.isFinite(Number(to.lat))?Number(to.lon).toFixed(7)+','+Number(to.lat).toFixed(7)+','+encodeURIComponent(to.name||to.address||'도착지'):'';
 if(f&&t)return 'https://way-m.map.naver.com/end-quick-path/'+f+'/'+t+'/-/car/0?nscs=0';
 return naverWebSearchUrl(to);
}
function drawRouteMap(){
 const el=document.getElementById('routeMap');if(!el)return;
 const ids=routeState.optimized||[];
 const stops=ids.map(id=>routeState.stops.find(p=>String(p.id)===String(id))).filter(Boolean);
 let start=routeState.routeStartMeta;
 if(start&&start.type==='stop'){
  const s=stops.find(x=>String(x.id)===String(start.stopId)); if(s)start=s;
 }
 const pts=[];
 if(start&&Number.isFinite(Number(start.lat))&&Number.isFinite(Number(start.lon)))pts.push({...start,_isStart:true});
 stops.forEach(x=>{if(!start||x.id!==start.id)pts.push(x)});
 if(!pts.length){el.innerHTML='';return}
 const lats=pts.map(p=>Number(p.lat)),lons=pts.map(p=>Number(p.lon));
 const minLat=Math.min(...lats),maxLat=Math.max(...lats),minLon=Math.min(...lons),maxLon=Math.max(...lons);
 const pad=34,w=720,h=360,dx=(maxLon-minLon)||0.01,dy=(maxLat-minLat)||0.01;
 const xy=p=>({x:pad+((Number(p.lon)-minLon)/dx)*(w-pad*2),y:h-pad-((Number(p.lat)-minLat)/dy)*(h-pad*2)});
 const line=pts.map(x=>{const q=xy(x);return q.x.toFixed(1)+','+q.y.toFixed(1)}).join(' ');
 const grid=[.2,.4,.6,.8].map(v=>`<line class="routeGrid" x1="${pad}" y1="${(h-pad*2)*v+pad}" x2="${w-pad}" y2="${(h-pad*2)*v+pad}"/><line class="routeGrid" x1="${(w-pad*2)*v+pad}" y1="${pad}" x2="${(w-pad*2)*v+pad}" y2="${h-pad}"/>`).join('');
 const marks=pts.map((p,i)=>{
  const q=xy(p), isStart=p._isStart;
  const visitNo=i+(start?0:1);
  const label=isStart?'출발':(visitNo+'. '+(p.name||'방문지'));
  // 가까운 지점의 이름이 겹치지 않도록 위/아래로 번갈아 배치합니다.
  const labelY=q.y-22-(i%2?0:0);
  const labelX=q.x+(i%2?16:-16);
  const anchor=i%2?'start':'end';
  return `<g><circle class="${isStart?'startDot':'routeDot'}" cx="${q.x}" cy="${q.y}" r="12"/>${!isStart?`<text class="routeNum" x="${q.x}" y="${q.y+4}" text-anchor="middle">${visitNo}</text>`:''}<text class="routeLabel" x="${labelX}" y="${labelY}" text-anchor="${anchor}">${esc(label).slice(0,16)}</text></g>`;
 }).join('');
 el.innerHTML=`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet" role="img" aria-label="선택된 방문 대상자의 대략적인 방문 순서 지도"><rect x="0" y="0" width="${w}" height="${h}" fill="#f7f8fb"/>${grid}<polyline class="routeLine" points="${line}"/>${marks}</svg>`;
}
function renderRoute(){
 const stops=routeState.stops||[];
 const selected=new Set((routeState.selectedIds||[]).map(String));
 const selectedCount=stops.filter(x=>selected.has(String(x.id))).length;
 const allSelected=stops.length>0&&selectedCount===stops.length;
 const ordered=(routeState.optimized||[]).map(id=>stops.find(x=>String(x.id)===String(id))).filter(Boolean);
 const startStopOptions=stops.filter(x=>selected.has(String(x.id))).map(x=>`<option value="${esc(x.id)}" ${routeState.startStopId===x.id?'selected':''}>${esc(x.name)} · ${esc(x.address)}</option>`).join('');
 const selectedRows=stops.map((x,i)=>`<label class="routeSelect"><input type="checkbox" ${selected.has(String(x.id))?'checked':''} onchange="routeToggleSelected('${String(x.id).replace(/'/g,"\\'")}',this.checked)"><span class="routeSelectMain"><span class="routeSelectName">${i+1}. ${esc(x.name)}</span><span class="routeSelectAddr">${esc(x.address)}</span></span></label>`).join('');
 const routeList=ordered.length?ordered:stops.filter(x=>selected.has(String(x.id)));
 main.innerHTML=`<div class="card"><b>🚗 방문 동선</b><p class="muted">엑셀에서 방문 후보를 불러온 뒤, 오늘 실제 방문할 대상자만 선택하세요.</p>
 <input id="routeExcelFile" type="file" accept=".xlsm,.xlsx,.xls">
 <div class="routeActions" style="margin-top:8px"><button class="primary" onclick="routeImportExcel()">📥 Excel 주소 불러오기</button><button onclick="routeClear()">초기화</button></div></div>
 ${stops.length?`<div class="card"><div class="routeTop"><b>방문 대상자 선택</b><button class="small" onclick="routeToggleAll()">${allSelected?'☐ 모두 해제':'☑ 모두 선택'}</button></div><div class="muted" style="margin-top:5px">${selectedCount}명 선택 / 전체 ${stops.length}명</div><div style="margin-top:5px">${selectedRows}</div></div>
 <div class="card"><b>출발지</b><div class="routeStartBox" style="margin-top:8px"><label style="display:flex;gap:9px;align-items:center;margin-bottom:9px"><input type="radio" name="routeStartMode" value="auto" ${routeState.startMode==='auto'?'checked':''} onchange="routeStartModeChanged(this.value)"> 자동으로 가장 효율적인 출발지 선택</label><label style="display:flex;gap:9px;align-items:center;margin-bottom:9px"><input type="radio" name="routeStartMode" value="current" ${routeState.startMode==='current'?'checked':''} onchange="routeStartModeChanged(this.value)"> 📍 현재 위치</label><label style="display:flex;gap:9px;align-items:center"><input type="radio" name="routeStartMode" value="stop" ${routeState.startMode==='stop'?'checked':''} onchange="routeStartModeChanged(this.value)"> 🏠 선택한 방문지에서 출발</label>${routeState.startMode==='stop'?`<select onchange="routeStartStopChanged(this.value)" style="margin-top:9px"><option value="">출발할 방문지 선택</option>${startStopOptions}</select>`:''}</div><div class="routeHint" style="margin-top:8px">현재 위치를 선택하면 휴대폰의 위치 권한을 통해 출발점을 확인합니다.</div><button id="routeOptimizeBtn" class="primary" style="width:100%;margin-top:10px" onclick="optimizeRoute()">🚗 선택한 방문지 최적화</button>${routeState.optimized.length?'<button class="primary" style="width:100%;margin-top:8px" onclick="openNaverFullRoute()">🧭 네이버지도에서 실제 이동경로 보기</button>':''}</div>`:''}
 ${routeList.length?`<div class="card"><b>추천 방문 순서 · ${routeList.length}곳</b><div style="margin-top:6px">${routeList.map((x,i)=>`<div class="routeItem"><div class="routeNum">${i+1}</div><div><b>${esc(x.name)}</b><div class="routeAddr">${esc(x.address)}</div></div><button class="small" title="네이버지도에서 길찾기" onclick="openNavigationToStopById('${String(x.id).replace(/'/g,"\\'")}')">🧭</button></div>`).join('')}</div></div>`:''}
 ${routeState.routeGeometry?`<div class="card"><b>한눈에 보는 방문 동선</b><div class="routeSummary" style="margin-top:8px">출발 <b>${esc(routeState.routeStartMeta?.name||'현재 위치')}</b><br>총 거리 <b>${routeState.routeDistance} km</b> · 예상 주행시간 <b>${routeState.routeDuration}분</b><br><span class="muted">${routeState.routeApproximate?'도로 경로 계산 서비스가 응답하지 않아 직선거리 기준으로 방문 순서를 추천했습니다. 실제 이동 경로는 네이버지도에서 다시 계산합니다.':'선택한 대상자만 실제 자동차 도로망을 기준으로 순서를 계산했습니다.'} 지도는 방문 위치와 순서를 쉽게 파악하기 위한 간단한 미리보기입니다.</span></div><div id="routeMap" class="routeMap"></div></div>`:''}

 `;
 if(routeState.routeGeometry)setTimeout(drawRouteMap,30);
}

function renderManage(){
 const trash=Array.isArray(state.trash)?state.trash:[];
 let trashHtml='';
 if(!trash.length){
   trashHtml='<div class="muted">휴지통이 비어 있습니다.</div>';
 }else{
   trashHtml=trash.slice().reverse().map(r=>{
     const n=Object.values(r.checks||{}).filter(Boolean).length;
     const total=Array.isArray(r.people)?r.people.length:0;
     const deleted=r.deletedAt?new Date(r.deletedAt).toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'';
     return `<div class="record"><b>${esc(r.title)}</b><div class="muted">구분: ${esc(r.topicType||inferTopicType(r.title))} · ${esc(r.date)} · ${n}명/${total}명 체크${deleted?' · 삭제 '+esc(deleted):''}</div><div class="actions" style="margin-top:8px"><button class="small" onclick="restoreTrash('${String(r.id).replace(/'/g,"\\'")}')">↩ 복원</button><button class="small danger" onclick="permanentDeleteTrash('${String(r.id).replace(/'/g,"\\'")}')">영구 삭제</button></div></div>`;
   }).join('');
 }
 main.innerHTML=`<div class="card"><b>관리</b><p class="muted">현재 기기의 브라우저에 명단과 기록이 저장됩니다.</p><button class="danger" onclick="resetAll()">전체 데이터 초기화</button></div>
 <div class="card"><b>🗑️ 기록 휴지통</b><p class="muted">삭제한 기록은 휴지통으로 이동하며, 직접 영구 삭제하기 전까지 보관됩니다.</p><div id="trashList">${trashHtml}</div>${trash.length?'<button style="width:100%;margin-top:10px" onclick="emptyTrash()">휴지통 비우기</button>':''}</div>
 <div class="card"><b>사용 순서</b><p class="muted">① 체크 항목 입력 → ② 이름 검색 또는 🎙️ 음성 → ③ 체크 → ④ 필요하면 아래에서 대상자 추가·삭제 → ⑤ 기록에서 Excel 저장</p></div>`;
}
function restoreTrash(id){
 const idx=state.trash.findIndex(x=>String(x.id)===String(id));
 if(idx<0){alert('휴지통에서 기록을 찾을 수 없습니다.');return}
 const r=JSON.parse(JSON.stringify(state.trash[idx]));
 delete r.deletedAt;
 if(state.records.some(x=>String(x.id)===String(r.id))){r.id=crypto.randomUUID()}
 state.records.push(r);
 state.trash.splice(idx,1);
 save();render();toast('기록을 복원했습니다.');
}
function permanentDeleteTrash(id){
 const idx=state.trash.findIndex(x=>String(x.id)===String(id));
 if(idx<0)return;
 if(!confirm('이 기록을 영구적으로 삭제할까요?\n영구 삭제 후에는 복원할 수 없습니다.'))return;
 state.trash.splice(idx,1);
 save();render();toast('기록을 영구 삭제했습니다.');
}
function emptyTrash(){
 if(!state.trash.length)return;
 if(!confirm(`휴지통의 ${state.trash.length}개 기록을 모두 영구 삭제할까요?\n삭제 후에는 복원할 수 없습니다.`))return;
 state.trash=[];save();render();toast('휴지통을 비웠습니다.');
}
function resetAll(){if(confirm('모든 명단과 기록을 삭제할까요?')){localStorage.removeItem(KEY);location.reload()}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>e.style.display='none',1500)}
render();
</script>
